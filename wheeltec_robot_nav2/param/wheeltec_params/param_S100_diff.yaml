amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.15   #里程计的旋转估计中来自旋转的预期过程噪声  0.4
    alpha2: 0.2   #里程计的旋转估计中来自平移的预期过程噪声
    alpha3: 0.2  #里程计的翻译估计中来自translation的预期过程噪声
    alpha4: 0.15  #里程计的平移估计中因旋转而产生的预期过程噪声  0.4
    alpha5: 0.2  #仅适用于 Omni 型号：translation噪音
    base_frame_id: "base_footprint" #机器人底座框架 
    introspection_mode: "disabled"  #启用调试模式，这将发布额外的调试信息
    beam_skip_distance: 0.5         #忽略似然场模型中大多数粒子不同意的光束。考虑跳过的最大距离（米）
    beam_skip_error_threshold: 0.9  #由于收敛性不好，未匹配地图后强制进行完全更新的光束百分比
    beam_skip_threshold: 0.3        #需要跳过的光束的百分比。
    do_beamskip: false              #是否在似然场模型中进行波束跳跃
    global_frame_id: "map"          #定位系统发布的坐标框架的名称
    lambda_short: 0.1               #模型 z_short 部分的指数衰减参数
    laser_likelihood_max_dist: 2.0  #在地图上进行障碍物膨胀的最大距离，用于似然场模型
    laser_max_range: 100.0          #要考虑的最大扫描范围，-1.0 将导致使用激光报告的最大范围
    laser_min_range: -1.0           #要考虑的最小扫描范围，-1.0 将导致使用激光报告的最小范围
    laser_model_type: "likelihood_field" #使用哪种模型，
    #beam、likelihood_field 或 unlikely_field_prob。与 unlikely_field 相同，但如果启用，则包含 beamskip 功能
    max_beams: 90                   #每次扫描取多少束参与更新。2026-08-06 由60提到90:
    #本车 /scan 是 MID360 转出来的1084束(有效率>94%), 60束抽得过稀, 单次更新的位姿
    #方差偏大, 表现为位姿轻微抖动。若日志开始刷 Control loop missed 就退回 60。
    max_particles: 2000             #允许的最大粒子数
    min_particles: 500              #允许的最小粒子数
    odom_frame_id: "odom_combined"  #使用哪个框架进行里程计
    pf_err: 0.05                    #粒子过滤器群体误差
    pf_z: 0.99                      #粒子过滤器群体密度
    recovery_alpha_fast: 0.0        #快速平均权重过滤器的指数衰减率，用于决定何时通过添加随机姿势进行恢复。
    recovery_alpha_slow: 0.0        #慢速平均权重过滤器的指数衰减率，用于决定何时通过添加随机姿势进行恢复。
    resample_interval: 1            #重采样之前所需的过滤器更新次数
    robot_model_type: "nav2_amcl::DifferentialMotionModel" #插件类的完全限定类型。
    #选项为“nav2_amcl::DifferentialMotionModel”和“nav2_amcl::OmniMotionModel”。

    save_pose_rate: 0.5             #将最后估计的姿势和协方差存储到参数服务器的最大速率（Hz）
    sigma_hit: 0.2                 #模型的 z_hit 部分中使用的高斯模型的标准差
    tf_broadcast: true              #将其设置为 false 以防止 amcl 发布全局框架和里程计框架之间的变换
    transform_tolerance: 0.3        #发布 map->odom 时向未来外推的时长(秒)。
    #2026-08-06 由 1.0 降到 0.3: 1秒的外推意味着位姿按当前速度硬推1秒, 车一动就有
    #可见的滞后/超前, 看起来就是"飘"。0.3 足够覆盖本机的TF延迟。
    update_min_a: 0.1              #转多少弧度才做一次滤波更新。2026-08-06 由 0.2 降到 0.1。
    update_min_d: 0.1              #走多远(米)才做一次滤波更新。2026-08-06 由 0.25 降到 0.1。
    #**这是"位姿慢慢偏、然后跳一下"的主因**: 两次更新之间 AMCL 不动 map->odom,
    #显示的位姿完全由里程计外推, 里程计漂多少就偏多少; 走满 0.25m 才更新一次,
    #最多能攒到 25cm 的偏差, 然后被一次修正猛拉回去 —— 看起来就是"动不动就漂"。
    #降到 0.1 后单次可攒的偏差降为 1/2.5, 代价是滤波更新频率变成 2.5 倍(CPU)。
    z_hit: 0.5                      #模型的 z_hit 部分的混合权重，所有使用的 z 权重之和必须为 1。
    z_max: 0.05                    #模型的 z_max 部分的混合权重，所有使用的 z 权重之和必须为 1。
    z_rand: 0.5                   #模型的 z_rand 部分的混合权重，所有使用的 z 权重之和必须为 1。
    z_short: 0.05                   #模型中 z_short 部分的混合权重，所有使用的 z 权重之和必须为 1。
    scan_topic: scan                #要订阅的激光雷达

    # Initial Pose
    set_initial_pose: True #AMCL 从 initial_pose* 参数设置初始姿势，而不是等待 initial_pose 消息
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0
    #Amcl参数解释参考：https://docs.nav2.org/configuration/packages/configuring-amcl.html

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    transform_tolerance: 0.1 #变换容差
    goal_reached_tol: 0.25 #接受姿势作为目标的容忍度(m)
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom_combined
    bt_loop_duration: 10        #BT 执行每次迭代的持续时间（以毫秒为单位
    default_server_timeout: 20  #BT 操作节点等待操作服务器确认时的默认超时值（以毫秒为单位）
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    #plugin_lib_names: #行为树节点共享库列表，Humble后的版本默认包含所有NAV2 BT库，这里可以加入自定义BT节点
    error_code_names:
    - compute_path_error_code 
    - follow_path_error_code

# bt_navigator参数说明：https://docs.nav2.org/configuration/packages/configuring-bt-navigator.html?highlight=bt_navigator

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False                             
    controller_frequency: 20.0                      #运行控制器的频率 (hz)
    controller_plugins: ["FollowPath"]              # 用于处理请求和参数的控制器插件的映射名称列表
    odom_topic: /odom_combined                      #里程计话题名称

    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker" # "precise_goal_checker"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      stateful: True

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController" #MPPI控制器
      time_steps: 56    #候选轨迹中的时间步长（点）数
      model_dt: 0.05    #每个时间步长的时间步长的长度dt（以秒为单位）是预测范围
      batch_size: 1000  #采样轨迹数(RDK X5算力有限, 2000会导致控制循环跑不满20Hz, 降为1000)
      vx_std: 0.2       #Vx 的抽样标准差
      vy_std: 0.0       #Vy 的抽样标准差  0.2
      wz_std: 0.18       #Wz抽样标准差(0.4会导致行驶左右扭摆, 降低使轨迹更直)
      vx_max: 0.5       #目标最大前进速度（米/秒）
      vx_min: -0.5      #目标最大反向速度（米/秒）
      vy_max: 0.5       #如果使用Omni运动模型，目标最大横向速度（m/s）
      wz_max: 1.2       #最大旋转速度(2.0甩头过猛, 降低后转向更柔和)
      ax_max: 0.5       #1.5
      ax_min: -0.5      #-1.5
      ay_max: 0.0
      az_max: 0.5       #1.5  # 2026-09-18 实测不生效: MPPI 实际下发角加速度95分位2.04rad/s², 远超此值(当前MPPI版本似乎不支持加速度约束)
      iteration_count: 1 #迭代次数
      prune_distance: 1.5 #路径上距离机器人最近点的距离（米）
      enforce_path_inversion: false
      transform_tolerance: 0.1 #使用 TF（s）进行数据转换的时间容差
      temperature: 0.2 #根据成本选择轨迹(0.3对噪声轨迹平均过多加剧扭摆, 降低更果断)
      gamma: 0.015 #平滑度（高）和低能耗（低）之间的权衡,保持默认值
      motion_model: "DiffDrive" #用于轨迹规划的所需运动模型。选项包括DiffDrive、Omni或Ackermann。
      visualize: true #发布调试轨迹供可视化。开启后才会发 /transformed_global_plan(webapp"局部路径"来源); /trajectories 无人订阅不发, 开销可控。
      TrajectoryVisualizer: #轨迹可视化
        trajectory_step: 5 #轨迹之间的步骤可视化以对候选轨迹池进行下采样
        time_step: 3 #轨迹上点之间的步骤可视化以降低轨迹密度的采样
      AckermannConstraints:
        min_turning_r: 0.25 #最小转弯半径（阿克曼运动模型）
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "TwirlingCritic"] #评论插件
      ConstraintCritic: #修复超出设定的动态或运动学约束的轨迹
        enabled: true
        cost_power: 1 
        cost_weight: 4.0  #权重参数
      
      GoalAngleCritic: #当距离目标较近时，GoalAngleCritic会激励导航以达到目标姿势的角度
        enabled: true
        cost_power: 1
        cost_weight: 3.0 #权重参数
        threshold_to_consider: 0.5  #考虑阈值：机器人与目标之间的最小距离（米），超过此距离则考虑角度目标成本

      GoalCritic: #当距离目标较近时，GoalCritic会激励机器人在空间上向目标导航
        enabled: true
        cost_power: 1
        cost_weight: 15.0 #权重参数
        threshold_to_consider: 1.4  #机器人与目标之间的最小距离（米），超过此距离则要考虑目标距离成本。

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5 #权重参数，通常优先选择成本较低的空间中的路线。
        critical_weight: 30.0 #应用于临界碰撞的权重，用于collision_margin_distance防止近距离碰撞
        consider_footprint: true #本车前悬40cm远超内切圆半径0.175, 必须用完整轮廓做碰撞检查, 否则车头会撞上内切圆模式认为安全的障碍(若CPU吃紧出现Control loop missed可改回false并降低vx_max)
        collision_cost: 10000.0 #应用于轨迹中真实碰撞的成本。
        collision_margin_distance: 0.1 #碰撞边缘距离，应该设置在0.05-0.2之间，请确保将此参数设置为预计机器人需要穿越的最窄空间
        near_goal_distance: 0.4 #靠近目标的距离（米）停止应用优先障碍物项，以允许机器人平稳地收敛到靠近障碍物的目标姿势，0.5 --> 0.6 -->0.3(Tues)
        # Humble版MPPI要求这两项与local_costmap的inflation_layer完全一致,
        # 否则障碍距离换算错误导致避障行为异常
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

      PreferForwardCritic: #激励机器人前进，而不是后退
        enabled: true
        cost_power: 1
        cost_weight: 1.5 #权重参数
        threshold_to_consider: 0.5 #机器人与目标之间的距离（米）停止考虑前锋并允许目标批评家接管。
      # Option to replace Cost and use Obstacles instead

      PathAlignCritic:  #PathAlignCritic会激励机器人与全局路径保持一致。它不实现路径跟随行为。
        enabled: true
        cost_power: 1
        cost_weight: 14.0 #权重参数(2026-09-18 由25降到Nav2默认14: 实测底盘转向=1.32×指令且滞后0.3s, 高权重把每次修正放大成持续扭摆)
        max_path_occupancy_ratio: 0.07 #最大路径占用率
        trajectory_point_step: 4
        threshold_to_consider: 0.5 #机器人与目标之间的距离阈值，阈值符合则停止考虑路径对齐并允许目标批评家接管。
        offset_from_furthest: 20 #最远偏移量
        use_path_orientations: false #是否在路径对齐中考虑路径的方向

      PathAngleCritic: #路径角度评论，机器人在因累积角度误差较大而需要时进行急转弯。
        enabled: true
        cost_power: 1
        cost_weight: 4.0 #权重参数
        offset_from_furthest: 4 #最远偏移量，任何轨迹达到最远路径点之后的路径点数，用于计算相对于的路径角度。
        threshold_to_consider: 0.5 #机器人与目标之间的距离阈值，阈值符合允许目标批评家接管。
        max_angle_to_furthest: 1.0 #机器人与目标之间的角距离
        mode: 0

      PathFollowCritic: #路径跟随评论家激励机器人沿着路径前进。
        enabled: true
        cost_power: 1
        cost_weight: 5.0 #权重参数(2026-09-18 由25降到Nav2默认5, 原因同PathAlignCritic)
        offset_from_furthest: 5
        threshold_to_consider: 1.4 #机器人与目标之间的距离阈值，停止考虑路径跟随，并允许目标评论家接管。
      TwirlingCritic: #转速惩罚(2026-09-18 新增): 实测底盘轮速环欠阻尼, 转向在0.5Hz处被放大到指令的1.4倍(车身1.7倍)且滞后0.32s, 正向行驶以0.52Hz持续扭摆; 惩罚猛转让修正更平缓, 不去激发这个共振
        enabled: true
        cost_power: 1
        cost_weight: 3.0 #代价=权重×轨迹平均|wz|; 持续扭摆(平均0.3rad/s)多0.9, 正常纠10°航向仍划算
#参数参考：https://docs.nav2.org/configuration/packages/configuring-mppic.html


controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0  #成本地图更新频率
      publish_frequency: 2.0 #将成本图发布到话题的频率
      # 2026-08-05 由 map 改为 odom_combined。原厂给的 map 是错的:
      # 滚动局部图里的障碍标记是按 global_frame 的坐标存的, 挂在 map 上时
      # AMCL/auto_relocalize 每做一次重定位修正(实测跳了 0.38m/0.34m),
      # 车在 map 里瞬移, 旧标记留在原坐标 -> 直接落到车身底下, 车"站在障碍里"
      # 起步就被拒绝。而车身周围那圈谁都清不掉: 相机 0.85m 内是盲区,
      # 雷达 /scan 是 base_footprint 系(z=0)的, 射线贴地跑只能清最底层体素,
      # 清不到相机标在 0.05~0.30m 的格子 -> 永久卡死。
      # 挂 odom 系后局部图只跟里程计(连续、不跳变), 重定位不再污染它。
      global_frame: odom_combined
      robot_base_frame: base_footprint #机器人底座框架
      use_sim_time: False  #仿真时间
      rolling_window: true #成本地图是否应随机器人基座框架滚动
      width: 3             #代价地图的宽度（m）
      height: 3            #代价地图的高度（m）
      resolution: 0.05     #代价地图1像素的分辨率，以米为单位
      #robot_radius: 0.20   #机器人半径，如果未提供足迹坐标，则使用机器人半径。
      footprint: "[[-0.4000, -0.1750], [-0.4000, 0.1750], [0.1000, 0.1750], [0.1000, -0.1750]]"  # 实测: 车50x35cm, 轴心距车头10cm (车身尺寸未变; 雷达2026-08-06移到车头相机上方 x=+0.078)
      plugins: ["voxel_layer","inflation_layer"] #插件包括:{“体素层”，“膨胀层”}
      inflation_layer:                             #膨胀层参数
        plugin: "nav2_costmap_2d::InflationLayer"  #膨胀层插件。
        cost_scaling_factor: 3.0                   #成本缩放因子，决定障碍物成本随距离的递减速度。
        inflation_radius: 0.35                     #膨胀半径
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"      #体素层插件。
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0                              #体素地图的起始Z坐标
        z_resolution: 0.05                         #体素地图的Z轴分辨率
        z_voxels: 16                               #体素地图的Z轴体素数量
        max_obstacle_height: 2.0                   #可检测障碍物的最大高度（米）
        mark_threshold: 0                          #标记体素的阈值
        # 2026-08-06: 雷达源曾一度改为 /scan_obstacle —— 当时雷达下倾42°, /scan 被迫
        # 用 0.15~2.0m 高带保定位, 那个带子拿来避障是错的。**雷达已改回水平安装**,
        # 0.15~0.45m 单带的方位覆盖实测回到 100%, 已撤回共用 /scan。
        # 2026-08-06: **camera 已从观测源里摘掉**(原为 "scan scan2 camera")。
        # 实测相机严重干扰局部障碍生成: 相机改平视后镜面地面反投影出 -0.17~-0.36m
        # 的鬼点, 部分落进高度带被标成障碍; 而相机 FOV 只有58°, 误标的格子背后
        # 没有射线去清 -> 车停着不动 lethal 格都能 7 秒内从 81 涨到 126 持续累积,
        # 膨胀层把车围死、下了目标点走不动。把 min_z 提到 0.15 只能缓解不能根治。
        # 下面的 camera: 段**保留但已失效**(不在 observation_sources 里就不会被读),
        # 想恢复相机避障: 这里加回 camera + launch 传 camera_avoid:=true, 两边都要。
        # 低矮障碍现在全靠雷达 —— 下倾40°后视野下沿落地在车头前约 25cm。
        observation_sources: scan scan2                  #观测源(camera 已摘除, 见上)
        scan:
          topic: /scan
          max_obstacle_height: 2.0                  #可检测障碍物的最大高度（米）
          clearing: True                            #是否启用障碍物清除功能
          marking: True                             #是否启用障碍物标记功能
          data_type: "LaserScan"                    #数据类型
          raytrace_max_range: 10.0                  #控制光线追踪从代价地图中清除障碍物的最大范围 
          raytrace_min_range: 0.0                  #控制光线追踪从代价地图中清除障碍物的最大范围 
          obstacle_max_range: 2.5                   #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.0                   #控制代价地图上标记障碍物的最小范围
        scan2:
          topic: /scan2
          max_obstacle_height: 2.0                  #可检测障碍物的最大高度（米）
          clearing: True                            #是否启用障碍物清除功能
          marking: True                             #是否启用障碍物标记功能
          data_type: "LaserScan"                    #数据类型
          raytrace_max_range: 10.0                  #控制光线追踪从代价地图中清除障碍物的最大范围 
          raytrace_min_range: 0.0                  #控制光线追踪从代价地图中清除障碍物的最大范围 
          obstacle_max_range: 2.5                   #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.0                   #控制代价地图上标记障碍物的最小范围
        # Astra 深度相机障碍点云 (wheeltec_fastlio/depth_obstacle_filter 输出)。
        # 补 MID360 看不到的低矮障碍: /scan 只取地面上 0.15~0.45m 的一层,
        # 门槛、拖鞋、凳子横档、车前 0.5m 内的东西雷达全看不见, 相机能看见。
        # 点云发布在相机光心系(不是base_footprint): nav2 用观测帧原点作为
        # raytrace 起点, 发成车体系会让清除射线从车中心出发, 清错格子。
        camera:
          topic: /camera/obstacle_points
          data_type: "PointCloud2"
          marking: True
          clearing: True                            #相机视野窄, 清除只在视野内生效
          min_obstacle_height: 0.15                 #与 depth_obstacle_filter 的 min_z 一致(兜底)。2026-08-06 由0.05提到0.15: 相机改平视后镜面地面会反投影出假点, 0.05会让lethal格持续累积把车围死
          max_obstacle_height: 1.20                 #高于车顶的东西撞不到
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5                   #超过2.5m深度噪声大, 只用来清除不用来标记
          obstacle_min_range: 0.0
          expected_update_rate: 0.0                 #相机掉线不报警(use_camera:=false时正常无此话题)
          observation_persistence: 0.0              #只用最新一帧, 不累积(防噪点残留)

      always_send_full_costmap: True                 #是否每次更新时都发送完整的成本图，而不是更新
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0             #成本地图更新频率
      publish_frequency: 1.0            #将成本图发布到话题的频率
      global_frame: map                 #全局框架
      robot_base_frame: base_footprint  #机器人底座框架
      use_sim_time: False               #仿真时间 
      #robot_radius: 0.20                #机器人半径
      footprint: "[[-0.4000, -0.1750], [-0.4000, 0.1750], [0.1000, 0.1750], [0.1000, -0.1750]]"  # 实测: 车50x35cm, 轴心距车头10cm (车身尺寸未变; 雷达2026-08-06移到车头相机上方 x=+0.078)
      resolution: 0.05                  #全局地图1像素的分辨率，以米为单位
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"] #插件包括：{“静态层”，“障碍层”，“膨胀层”}
      obstacle_layer:  #障碍层参数
        plugin: "nav2_costmap_2d::ObstacleLayer" #障碍层插件
        enabled: True
        observation_sources: scan scan2                 #观测源
        scan:
          topic: /scan
          max_obstacle_height: 2.0                 #可检测障碍物的最大高度（米）
          clearing: True                           #是否启用障碍物清除功能
          marking: True                            #是否启用障碍物标记功能
          data_type: "LaserScan"                   #数据类型
          raytrace_max_range: 10.0                 #控制光线追踪从代价地图中清除障碍物的最大范围 
          raytrace_min_range: 0.0                  #控制光线追踪从代价地图中清除障碍物的最大范围 
          obstacle_max_range: 2.5                  #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.0                  #控制代价地图上标记障碍物的最小范围
        scan2:
          topic: /scan2
          max_obstacle_height: 2.0                 #可检测障碍物的最大高度（米）
          clearing: True                           #是否启用障碍物清除功能
          marking: True                            #是否启用障碍物标记功能
          data_type: "LaserScan"                   #数据类型
          raytrace_max_range: 10.0                 #控制光线追踪从代价地图中清除障碍物的最大范围 
          raytrace_min_range: 0.0                  #控制光线追踪从代价地图中清除障碍物的最大范围 
          obstacle_max_range: 2.5                  #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.0                  #控制代价地图上标记障碍物的最小范围
        # 相机障碍**故意只进 local_costmap, 不进这里**:
        # 全局图不是滚动窗口, 相机视野只有约58°, 车开走后误检的点没有射线去清除,
        # 会在全局图上留下永久幻影障碍(极端情况能把门口堵死, 让NavFn规划不出路)。
        # 局部图是滚动窗口 + observation_persistence:0, 噪点最多存在一帧。
        # 低矮障碍靠 MPPI 局部避障绕开就够了。若确实需要全局记住相机障碍,
        # 把 observation_sources 改成 "scan scan2 camera" 并照抄 local 的 camera 段。
      static_layer: #静态层参数
        plugin: "nav2_costmap_2d::StaticLayer"     #静态层插件
        map_subscribe_transient_local: True
      inflation_layer: #膨胀层参数
        plugin: "nav2_costmap_2d::InflationLayer"  #膨胀层插件
        cost_scaling_factor: 3.0                   #成本缩放因子，决定障碍物成本随距离的递减速度。
        inflation_radius: 0.3                     #膨胀半径
      always_send_full_costmap: True               #是否每次更新时都发送完整的成本图，而不是更新
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "WHEELTEC3D.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0                #尝试保存地图的超时时间（秒）
    free_thresh_default: 0.25            #占用网格的自由空间最大概率阈值
    occupied_thresh_default: 0.65        #占用网格的占用空间最小概率阈值
    map_subscribe_transient_local: True  #地图话题的 QoS 设置

planner_server: #规划器服务器参数
  ros__parameters:
    expected_planner_frequency: 1.0     #预期的规划器频率。如果当前频率小于预期频率，则显示警告消息。
    use_sim_time: False
    planner_plugins: ["GridBased"] #规划器插件类型，需要与BT Tree文件匹配
    # 差速车(可原地转)不应使用 SmacPlannerHybrid+DUBIN(阿克曼车模型: 只能前进+
    # 最小转弯半径约束), 在家具密集环境会频繁 "no valid path" 且起点检查过严
    # ("Starting point in lethal space")。换成 NavFn: 无运动学约束、对起点宽容。
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3        # 目标不可达时允许的就近容差(米)
      use_astar: false      # false=Dijkstra(更稳), true=A*(更快)
      # 2026-08-05 由 false 改为 true。原因: 本场地地面是镜面抛光的, 掠射角下
      # 激光被镜面反射走、收不到回波, 而 pcd2pgm 判定"可通行"完全依赖地面点,
      # 于是地图里大片本来能走的地方是未知(实测房间内自由区仅 3.9%, 加了
      # 形态学闭运算+填洞后也只到 5.6%)。allow_unknown:false 时规划器过不去这些
      # 未知格 -> 下了目标点车纹丝不动, 现场表现就是"导航坏了"。
      # 放开后: 墙壁等真实障碍仍是 100(占据)挡着, 未知区当可走, 走进去以后靠
      # 局部代价地图(雷达+相机)实时发现障碍。地面能正常回波的场地可以改回 false。
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 0.1  #TF transform tolerance.
      max_its: 1000
      do_refinement: True

# 恢复行为坐标系: 默认local_frame是odom, 本车里程计框架为odom_combined,
# 不设置会报 "target frame odom does not exist", spin/backup恢复行为全部失败
behavior_server:
  ros__parameters:
    local_frame: odom_combined
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2

