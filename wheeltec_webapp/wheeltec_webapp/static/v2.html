<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WHEELTEC 控制台</title>
<!--
  双模式控制台 (2026-08-06 起)。挂在 /v2, 与老版 index.html 并存, 说的是同一套 WS 协议。

  为什么另起一个文件而不是原地改: 这次是整页重构(双模式框架 / 导航模式全屏浮层 /
  建图模式3D点云), 中途必然有不可用的状态, 而这台车的控制台要一直能用。
  验收通过后再把 / 指过来。

  【布局约定】
    首页(2026-08-07 改成仪表盘): 左栏 = 时钟(左列 时间+日期 | 右列 运行时间) +
      2×3 指标磁贴(标题左上、副标题右上、大数居中、趋势曲线铺底) + 一排状态胶囊;
      右栏 = 四个入口横向长条卡, 每条带实时状态副标题和右侧读数。
      磁贴的趋势样本在收到 state 时采(pushHist), 不在 renderHome 里采。
    顶栏 = 模式开关(导航/建图) + 该模式的操作按钮 + 右侧状态区 + 设置
    导航模式: 全屏2D地图, 相机浮左上, 图标按钮列在相机下方, 摇杆浮右下, 日志浮在摇杆上方
    建图模式: 全屏3D点云(WebGL), 相机浮左上, 按钮列在相机下方, 摇杆+日志浮右侧

  【语音播报】音频离线预生成在 static/voice/<key>.mp3, key 就是文件名。
    新增一条: SPEAK 表加一行 + tools/gen_voice.py 的 PHRASES 加同名一行, 重跑脚本。
-->
<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --panel2:#eef1f6; --fg:#1a2130; --dim:#68748a; --dim2:#a8b2c2;
  --line:#e3e8f0; --accent:#2f7ef7; --accent-soft:#2f7ef714; --ok:#17b978; --ok-soft:#17b9781a;
  --cyan:#06b6d4; --cyan-soft:#06b6d414;
  --warn:#f5a524; --err:#ec4b4b; --r:14px; --r-pill:999px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --shadow:0 1px 2px #0b1a330a,0 6px 20px #0b1a3310;
  --shadow-lg:0 2px 6px #0b1a330d,0 16px 44px #0b1a3316;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1420; --panel:#161d2b; --panel2:#1e2636; --fg:#e8edf6; --dim:#94a1b6;
        --dim2:#5b6779; --line:#26303f; --accent:#4d92ff; --accent-soft:#4d92ff26;
        --cyan:#22d3ee; --cyan-soft:#22d3ee1f;
        --shadow:0 1px 2px #0004,0 6px 20px #0006;
        --shadow-lg:0 2px 6px #0005,0 16px 44px #0008;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 长按选中文字会连带出现拖拽行为, 画布类界面上纯属干扰 */
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
/* 全屏时整页仍能被拖动/回弹 —— 只设 overflow:hidden 不够, 移动端浏览器的
   overscroll 和触摸平移是另一套。position:fixed 钉死 + overscroll-behavior:none
   + touch-action:none, 三者缺一不可。用 100dvh 避开移动端地址栏导致的高度跳变。 */
html,body{margin:0;padding:0;width:100%;height:100%;height:100dvh;position:fixed;
  inset:0;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-text-size-adjust:100%;background:var(--bg);color:var(--fg);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---------------- 顶栏 ---------------- */
#top{position:fixed;top:0;left:0;right:0;height:54px;z-index:40;display:flex;align-items:center;
  gap:10px;padding:0 14px;background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);
  position:fixed}
#top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--cyan),transparent);
  opacity:.5}
/* 模式开关: 两段式胶囊, 是整个界面的总闸 */
#modeSw{flex:none;display:flex;background:var(--panel2);border-radius:var(--r-pill);padding:3px;gap:2px}
#modeSw button{padding:6px 14px;border-radius:var(--r-pill);font-weight:600;font-size:13px;
  color:var(--dim);display:flex;align-items:center;gap:6px;transition:.15s}
#modeSw button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
#modeSw button:disabled{opacity:.45;cursor:not-allowed}
#menu{flex:1;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
#menu::-webkit-scrollbar{display:none}
.mbtn{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-pill);
  background:var(--panel2);font-size:13px;font-weight:600;white-space:nowrap;
  transition:transform .12s,background .15s}
.mbtn{border:1px solid transparent}
.mbtn:hover{background:var(--line)}
.mbtn:active{transform:scale(.96)}
.mbtn:not(.primary):not(.danger){border-color:var(--line)}
.mbtn.primary{box-shadow:0 2px 10px #2f7ef73d}
.mbtn.primary{background:var(--accent);color:#fff}
.mbtn.danger{background:#ec4b4b1a;color:var(--err)}
.mbtn:disabled{opacity:.4;cursor:not-allowed}
#status{flex:none;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);
  border-radius:var(--r-pill);padding:5px 10px;white-space:nowrap;max-width:190px;overflow:hidden;
  text-overflow:ellipsis}
.chip b{color:var(--fg);font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim2);flex:none}
/* WiFi 信号: 弧形图标, 按强度点亮内层到外层。
   不用四根竖条 —— 竖条是手机蜂窝信号的画法, 一眼看过去像 4G。 */
.wsig{display:inline-flex;align-items:center}
.wsig svg{width:17px;height:17px;display:block;fill:none;stroke:var(--dim2);
  stroke-width:2.1;stroke-linecap:round}
.wsig .a0{fill:var(--dim2);stroke:none}
.wsig[data-lv="1"] .a1,
.wsig[data-lv="2"] .a1,.wsig[data-lv="2"] .a2,
.wsig[data-lv="3"] .a1,.wsig[data-lv="3"] .a2,.wsig[data-lv="3"] .a3{stroke:var(--ok)}
.wsig[data-lv="1"] .a0,.wsig[data-lv="2"] .a0,.wsig[data-lv="3"] .a0{fill:var(--ok)}
.wsig[data-lv="0"]{opacity:.5}
.wsig[data-lv="0"] .sl{stroke:var(--err);opacity:.9}   /* 没连上时画一道斜杠 */
.wsig .sl{display:none}
.wsig[data-lv="0"] .sl{display:block}
.apdot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:8px;background:var(--panel2);color:var(--dim2)}
.apdot.on{background:var(--ok-soft);color:var(--ok)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft),0 0 8px var(--ok);
  animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
.dot.off{background:var(--dim2)}
#btnSet{flex:none;width:34px;height:34px;border-radius:50%;background:var(--panel2);
  display:flex;align-items:center;justify-content:center}
#btnSet:hover{background:var(--line)}

/* ---------------- 首页(驾驶舱仪表盘) ----------------
   左 = 遥测: 一行时钟 + 2×3 指标磁贴(带迷你趋势条) + 一排状态胶囊
   右 = 四个入口, 横向长条卡, 每条第二行是该入口的实时状态副标题
   磁贴的取值/趋势见 JS 的 renderHome/pushHist。 */
/* 左栏拿 46%: 磁贴要塞下"图标+标题+大数+副标题+趋势条", 37% 时明显偏挤,
   而右边四张长条卡本来就宽松, 匀过去正好。 */
#home{position:fixed;inset:0;z-index:30;display:none;overscroll-behavior:none;
  grid-template-columns:minmax(400px,46%) 1fr;gap:16px;padding:16px;
  padding-top:calc(16px + env(safe-area-inset-top));
  background:
    radial-gradient(1100px 620px at 12% -10%, color-mix(in srgb,var(--accent) 11%,transparent), transparent 62%),
    radial-gradient(900px 560px at 105% 108%, color-mix(in srgb,#8b5cf6 10%,transparent), transparent 60%),
    var(--bg)}
#home.show{display:grid}
/* min-height:0 是给下面 #hTiles 的 flex:1 留出压缩空间的 —— 没有它, flex 子项
   按内容高度撑着不肯缩, 短屏(如 960x600 的平板)上左栏就会超出一屏、变成可拖动。 */
#hLeft{background:var(--panel);border-radius:20px;box-shadow:var(--shadow-lg);padding:16px;
  overflow-y:auto;display:flex;flex-direction:column;border:1px solid var(--line);
  touch-action:pan-y;overscroll-behavior:none;min-height:0}
#hHead{display:flex;align-items:center;gap:12px;padding-bottom:13px;
  border-bottom:1px solid var(--line)}
#hHead .logo{width:46px;height:46px;border-radius:14px;flex:none;display:flex;
  align-items:center;justify-content:center;color:#fff;position:relative;
  background:linear-gradient(140deg,#2f7ef7,#22d3ee);box-shadow:0 6px 18px #2f7ef751}
#hHead .logo::after{content:'';position:absolute;inset:-5px;border-radius:19px;
  background:inherit;filter:blur(14px);opacity:.4;z-index:-1}
#hHead .logo .ic{width:25px;height:25px}
#hLeft h2{margin:0;font-size:19px;letter-spacing:-.3px;font-weight:650}
#hLeft .sub{color:var(--dim);font-size:12.5px;display:flex;align-items:center;gap:6px;
  margin-top:3px}
/* 时钟: 左列 时间+日期, 右列 运行时间**单独一列**(和时间叠在一列里读起来费劲) */
#hClock{margin:13px 0 0;padding:11px 15px 10px;border-radius:14px;position:relative;
  overflow:hidden;border:1px solid var(--line);flex:none;
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 10%,var(--panel2)),
             color-mix(in srgb,var(--cyan) 7%,var(--panel2)))}
/* 背景里一层很淡的网格, 机器人仪表的味道 */
#hClock::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:22px 22px;
  -webkit-mask:linear-gradient(105deg,#000,transparent 72%);
  mask:linear-gradient(105deg,#000,transparent 72%)}
#hClock>*{position:relative}
#hClock .r1{min-width:0}
#hTime{font-size:27px;font-weight:300;letter-spacing:1.5px;line-height:1;
  font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);
  text-shadow:0 0 22px color-mix(in srgb,var(--accent) 30%,transparent)}
#hDate{margin-top:6px;font-size:13.5px;font-weight:600;color:var(--fg)}
/* 运行时间自己一列: 靠右, 一条竖线和时间那列分开 */
#hUp{margin-left:auto;flex:none;padding-left:14px;text-align:right;
  border-left:1px solid var(--line)}
#hUp .k{display:block;font-size:11.5px;letter-spacing:.4px;color:var(--dim2)}
#hUp b{display:block;margin-top:5px;font-size:15.5px;font-weight:600;color:var(--fg);
  font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- 2×3 指标磁贴 ----
   flex:1 + minmax(74px,1fr) + max-height: 高屏上不超过 460px(再高就是空), 短屏上
   一路压到 74px 也不会把左栏顶出一屏。目标是**任何平板尺寸首页都正好一屏** ——
   一屏装得下就没得拖, 用户反馈的"还能拖动摇晃"本质是内容超出后在滚容器里滑。 */
#hTiles{display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(3,minmax(74px,1fr));gap:10px;margin-top:12px;
  flex:1;min-height:0;max-height:460px}
.tile{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:13px;
  background:var(--panel2);padding:10px 12px 12px;min-height:0;
  display:flex;flex-direction:column}
/* 左上角一道极细的状态色, 平时是主色, 报警时整块跟着变 —— 余光扫一眼就知道有没有事 */
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2.5px;
  background:var(--accent);opacity:.55}
.tile.ok::before{background:var(--ok)}
.tile.warn::before{background:var(--warn);opacity:1}
.tile.err::before{background:var(--err);opacity:1}
.tile.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.tile.err{border-color:color-mix(in srgb,var(--err) 55%,var(--line));
  background:color-mix(in srgb,var(--err) 7%,var(--panel2))}
.tile .th{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;
  letter-spacing:.4px;color:var(--dim2)}
.tile .th .ic{width:14px;height:14px;stroke-width:2.2;flex:none}
.tile .th .tn{flex:none}
/* 上下各一个 auto 把富余高度**均分**成两段 —— 磁贴被拉高时数值不会孤零零吊在
   顶上, 矮的时候 auto 归零, 自动退回紧凑排布。
   z-index:1: 趋势条是定位元素、在 DOM 里又排在后面, 不抬一手线会从数字上横穿过去。 */
.tile .tv{margin:auto 0;padding-top:5px;font-size:27px;font-weight:600;line-height:1.1;
  font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-1px;
  color:var(--fg);white-space:nowrap;position:relative;z-index:1}
.tile .tv i{font-style:normal;font-size:13px;font-weight:500;color:var(--dim);
  margin-left:3px;letter-spacing:0}
.tile.warn .tv{color:var(--warn)} .tile.err .tv{color:var(--err)}
/* 副标题挪到右上角(跟标题同一行, 靠右): 原来压在磁贴底部, 和趋势曲线抢同一块地方,
   字骑在线上两边都看不清。挪上来之后底部整幅留给曲线。 */
.tile .ts{margin-left:auto;min-width:0;padding-left:8px;text-align:right;
  font-size:11.5px;font-weight:500;letter-spacing:0;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 迷你趋势条: 贴着磁贴底部整幅铺开, 在文字下面走。
   高度按磁贴百分比给 —— 磁贴被拉高时曲线跟着长, 空出来的地方是数据而不是留白。 */
.spk{position:absolute;left:0;right:0;bottom:0;width:100%;pointer-events:none;
  height:38%;min-height:26px;max-height:62px}
/* preserveAspectRatio=none 会把线宽也横向拉扁, non-scaling-stroke 才能保持粗细 */
.spk .ln{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round;
  stroke-linecap:round;vector-effect:non-scaling-stroke}
.spk .ar{stroke:none;fill:var(--accent);opacity:.13}
.tile.ok .spk .ln{stroke:var(--ok)}    .tile.ok .spk .ar{fill:var(--ok)}
.tile.warn .spk .ln{stroke:var(--warn)}.tile.warn .spk .ar{fill:var(--warn)}
.tile.err .spk .ln{stroke:var(--err)}  .tile.err .spk .ar{fill:var(--err)}
/* 网络磁贴不是一个数, 用两行 "灯+名字" 代替大数字(整组和别的磁贴数值一样上下居中) */
.tile.net .nw{margin:auto 0;padding-top:5px;min-width:0}
.tile.net .nr{display:flex;align-items:center;gap:7px;font-size:13px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.net .nr+.nr{margin-top:7px}
.tile.net .nr b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.tile.net .nr .k{color:var(--dim2);flex:none;width:30px}

/* ---- 状态胶囊 ---- */
#hChips{display:flex;flex-wrap:wrap;gap:7px;padding-top:12px;flex:none}
.chip{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 11px;
  border-radius:var(--r-pill);background:var(--panel2);color:var(--dim);
  border:1px solid var(--line);white-space:nowrap}
.chip b{color:var(--fg);font-weight:600}

/* ---- 右侧四个入口: 横向长条 ---- */
#hRight{display:grid;grid-template-columns:1fr;grid-template-rows:repeat(4,1fr);gap:14px}
.hbtn{background:var(--panel);border-radius:20px;box-shadow:var(--shadow);display:flex;
  flex-direction:row;align-items:center;gap:16px;padding:18px 20px;
  transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s;
  position:relative;overflow:hidden;text-align:left;border:1px solid var(--line)}
.hbtn .glow{position:absolute;inset:0;opacity:0;transition:opacity .18s;
  background:linear-gradient(100deg,var(--accent-soft),transparent 55%);pointer-events:none}
.hbtn:hover .glow{opacity:1}
.hbtn::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;opacity:0;
  transition:opacity .18s;background:linear-gradient(180deg,var(--accent),var(--cyan))}
.hbtn:hover{transform:translateX(3px);box-shadow:var(--shadow-lg);border-color:transparent}
.hbtn:hover::after{opacity:1}
.hbtn:active{transform:translateX(1px) scale(.995)}
.hbtn>*{position:relative;z-index:1}
.hbtn::before{content:'';position:absolute;right:-34px;top:-34px;width:120px;height:120px;
  border:1px solid var(--line);border-radius:50%;opacity:.6;pointer-events:none}
.hbtn .hi{width:60px;height:60px;border-radius:18px;flex:none;display:flex;
  align-items:center;justify-content:center;color:#fff;position:relative}
.hbtn .hi::after{content:'';position:absolute;inset:-6px;border-radius:24px;
  background:inherit;filter:blur(16px);opacity:.30;z-index:-1}
.hbtn .hi .ic{width:31px;height:31px;stroke-width:1.8}
.hbtn .hx{flex:1;min-width:0}
.hbtn b{display:block;font-size:20px;letter-spacing:-.3px;font-weight:650}
.hbtn small{display:block;margin-top:3px;color:var(--dim);font-size:12.5px;font-weight:400;
  line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 右侧读数: 长条卡横向很宽, 只放标题+副标题右半边会空掉一大片 */
.hbtn .hm{flex:none;text-align:right;padding-left:8px}
.hbtn .hm em{display:block;font-style:normal;font-size:18px;font-weight:650;
  font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.5px;
  color:var(--fg);white-space:nowrap}
.hbtn .hm span{display:block;margin-top:2px;font-size:10.5px;color:var(--dim2);
  letter-spacing:.4px;white-space:nowrap}
.hbtn .chev{width:18px;height:18px;flex:none;color:var(--dim2);stroke-width:2.4}
.hbtn .tag{flex:none;font-size:11px;padding:4px 10px;border-radius:var(--r-pill);
  background:var(--ok-soft);color:var(--ok);font-weight:600;
  display:flex;align-items:center;gap:5px}
.hbtn .tag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ok);
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
@media (max-width:760px){
  /* 窄屏改成上下: 遥测在上(高度自适应), 入口在下。长条卡这时反而比方块好按。 */
  #home{grid-template-columns:1fr;grid-template-rows:auto auto;overflow:auto;gap:12px;
    padding:12px;padding-top:calc(12px + env(safe-area-inset-top))}
  #hLeft{overflow:visible;flex:none}
  /* 手机上磁贴压矮(高度不再跟着屏幕走, 整页是滚动的), 下面的四个入口才能露出来 */
  #hTiles{grid-template-rows:repeat(3,minmax(76px,100px));gap:8px;flex:none;max-height:none}
  .tile{padding:8px 10px 10px}
  .tile .tv{font-size:23px}
  .tile .th{font-size:12px}
  /* 窄屏磁贴一行塞"标题+右上角副标题"很紧, 副标题再收一号, 放不下的截断(有 title) */
  .tile .ts{font-size:11px;padding-left:6px}
  #hTime{font-size:27px}
  .spk{max-height:34px}
  #hRight{grid-template-rows:repeat(4,auto);gap:10px}
  .hbtn{padding:14px 16px;gap:13px;border-radius:17px}
  .hbtn .hi{width:46px;height:46px;border-radius:14px}
  .hbtn .hi .ic{width:24px;height:24px}
  .hbtn b{font-size:16px}
  .hbtn small{font-size:11.5px}
  /* 手机上一条卡里塞不下"图标+标题+副标题+读数+箭头", 读数让位(副标题里已经有了) */
  .hbtn .hm{display:none}
}
/* ---------------- 全屏子页(地图库/设置) ---------------- */
.page{position:fixed;inset:54px 0 0 0;z-index:25;background:var(--bg);display:none;
  overflow-y:auto;overflow-x:hidden;padding:20px 16px 28px;
  touch-action:pan-y;overscroll-behavior:none;-webkit-overflow-scrolling:touch}
.page.show{display:block}
.page .card{max-width:620px;margin:0 auto 14px;background:var(--panel);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.page .card h4{margin:0;padding:12px 16px;font-size:13px;color:var(--dim);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.page .card .in{padding:12px 16px}
#back{flex:none;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r-pill);
  background:var(--panel2);font-size:13px;font-weight:560}
#back:hover{background:var(--line)}
#title{flex:none;font-size:15px;font-weight:600;margin-right:4px}

/* ---------------- 主画布 ---------------- */
#stage{position:fixed;inset:54px 0 0 0;overflow:hidden;touch-action:none}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(120% 90% at 50% 50%,transparent 55%,#0b1a3314 100%)}
#cv2d,#cv3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cv3d{display:none}

/* ---------------- 浮层通用 ---------------- */
.float{position:absolute;z-index:20;background:color-mix(in srgb,var(--panel) 80%,transparent);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg)}
/* 【浮层布局】左上相机 → 其下面板 → 左下日志; 右侧一列操作按钮; 右下摇杆;
   底部居中图例+比例尺。 */
#pip{left:14px;top:14px;width:320px;overflow:hidden;padding:0}
#pip .pip-body{position:relative;width:100%;aspect-ratio:4/3;background:#0007}
#pipImg{width:100%;height:100%;object-fit:cover;display:block}
#pipMini{position:absolute;inset:0;width:100%;height:100%;display:none}
#pipHint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#fff9;text-align:center;padding:0 12px}
#pipTop{display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px 7px 13px;font-size:11.5px;color:var(--dim);font-weight:600;
  position:relative;border-bottom:1px solid var(--line)}
#pipTop::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;
  border-radius:0 3px 3px 0;background:var(--cyan);opacity:.7}
#pipTop>span:first-child{display:flex;align-items:center;gap:6px}
#pipTop .sp{cursor:pointer;opacity:.6;padding:0 4px}
#pipTop .sp:hover{opacity:1}
#pip.fold .pip-body,#pip.fold #pipBar{display:none}
#pipBar{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;
  font-size:11px;color:var(--dim)}
/* 操作按钮: 右侧一列(上半操作, 分隔线以下视图控制), 底止于摇杆上方 */
#tools{right:14px;top:14px;bottom:206px;display:flex;flex-direction:column;gap:6px;
  padding:7px;width:54px;overflow-y:auto;scrollbar-width:none;align-items:center;
  touch-action:pan-y}
#tools::-webkit-scrollbar{display:none}
#tools .sep{width:26px;height:1px;background:var(--line);flex:none;margin:2px 0}

/* ---------------- 地图编辑页 ----------------
   整屏画布 + 右侧工具列 + 底部材质/笔刷条。touch-action:none 是必须的:
   不写的话 pad 上一拖就变成页面滚动, 画不出线。 */
#pgEdit{position:fixed;inset:54px 0 0 0;overflow:hidden;display:none;
  background:var(--bg);z-index:26;touch-action:none}
#pgEdit.show{display:block}
#edCv{position:absolute;inset:0;width:100%;height:100%;display:block;
  touch-action:none;cursor:crosshair}
#edTools{right:14px;top:14px;display:flex;flex-direction:column;gap:6px;
  padding:7px;width:54px;align-items:center;max-height:calc(100% - 120px);
  overflow-y:auto;scrollbar-width:none}
#edTools::-webkit-scrollbar{display:none}
#edTools .sep{width:26px;height:1px;background:var(--line);flex:none;margin:2px 0}
/* width:max-content 不能省 —— 绝对定位 + left:50% 的元素按"收缩到适应"算宽度,
   可用宽度只剩容器的一半(1280 屏上只有 640), 内容会被莫名其妙地折行。 */
#edBar{left:50%;transform:translateX(-50%);bottom:14px;display:flex;align-items:center;
  gap:12px;padding:9px 14px;width:max-content;max-width:calc(100vw - 92px);
  flex-wrap:wrap;justify-content:center}
#edBar .grp{display:flex;align-items:center;gap:7px}
#edBar .lb{font-size:11.5px;color:var(--dim);font-weight:600;white-space:nowrap}
#edBar .div{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
/* 材质色块: 直接显示写进 PGM 的那三种像素值, 所见即所存 */
.mat{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);
  position:relative;flex:none;transition:transform .12s,border-color .15s}
.mat.on{border-color:var(--accent);transform:scale(1.06)}
.mat.on::after{content:'';position:absolute;inset:-6px;border-radius:13px;
  border:1.5px solid var(--accent);opacity:.45}
.mat[data-m="2"]{background:#000}
.mat[data-m="1"]{background:#fff}
.mat[data-m="0"]{background:#808080}
#edSize{width:104px;accent-color:var(--accent)}
#edZoom{font-family:var(--mono);font-size:11.5px;color:var(--dim);min-width:52px;
  text-align:right}
.ebtn{display:flex;align-items:center;gap:5px;padding:8px 12px;border-radius:11px;
  background:var(--panel2);font-size:12.5px;font-weight:600;white-space:nowrap}
.ebtn:hover{background:var(--line)}
.ebtn .ic{width:15px;height:15px}
.ebtn.pri{background:var(--accent);color:#fff}
.ebtn.pri:hover{filter:brightness(1.08)}
#edPos{font-family:var(--mono);font-size:11.5px;color:var(--dim2);min-width:96px}
#edName{position:absolute;left:14px;top:14px;z-index:20;display:flex;align-items:center;
  gap:8px;padding:8px 13px;font-size:12.5px;font-weight:600}
#edName .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
#edName.dirty .dot{background:var(--warn)}
#edName small{color:var(--dim);font-weight:500}
#edHint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow-lg);padding:18px 22px;font-size:13px;display:none;
  max-width:min(90vw,340px)}
#edHint.show{display:block}
#edHint b{display:block;font-size:14px;margin-bottom:10px}
#edHint div{display:flex;gap:10px;padding:4px 0;color:var(--dim);align-items:baseline}
#edHint i{font-style:normal;color:var(--fg);font-weight:600;min-width:74px;flex:none}
#edHint .tail{display:block;color:var(--dim2);font-size:11.5px;margin-top:10px;
  line-height:1.5}
#edHint button{margin-top:12px;width:100%;padding:9px;border-radius:11px;
  background:var(--accent);color:#fff;font-weight:600;font-size:13px}
.tool{width:40px;height:40px;border-radius:12px;background:var(--panel2);display:flex;
  align-items:center;justify-content:center;position:relative;flex:none;
  transition:transform .12s,background .15s,color .15s}
.tool:hover{background:var(--line)}
.tool:active{transform:scale(.92)}
.tool.on{background:var(--accent);color:#fff;
  box-shadow:0 2px 10px #2f7ef766,inset 0 0 0 1px #ffffff33}
.tool.danger{color:var(--err)}
.tool.danger:hover{background:#ec4b4b1a}
.tool:disabled{opacity:.32;cursor:not-allowed}
.tool .ic{width:19px;height:19px}
/* 长按提示 */
#tip{position:fixed;z-index:70;background:#000c;color:#fff;font-size:12px;padding:6px 10px;
  border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap}
#tip.show{opacity:1}

#needle{display:flex;transition:transform .2s}
/* 图例+比例尺: 底部居中一条 */
/* 图例: 顶部, 起点对齐实时画面右缘, 单行不换行(放不下就横向滚) */
#legend{position:absolute;left:346px;right:80px;top:14px;z-index:21;
  display:flex;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
  gap:14px;padding:9px 16px;border-radius:var(--r-pill);
  font-size:11px;color:var(--dim);
  background:color-mix(in srgb,var(--panel) 86%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);box-shadow:var(--shadow)}
#legend{touch-action:pan-x}
#legend::-webkit-scrollbar{display:none}
#legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex:none}
#legend i{width:10px;height:10px;border-radius:3px;flex:none}
#legend .tg{cursor:pointer;user-select:none;transition:.14s}
#legend .tg:hover{color:var(--fg)}
#legend .tg.off{opacity:.32;text-decoration:line-through}
/* 3D 手势速查卡: 建图页左下角, 避开右侧工具列和右下摇杆 */
#gesHint{position:absolute;left:14px;bottom:14px;z-index:6;display:none;
  background:color-mix(in srgb,var(--panel) 94%,transparent);
  border:1px solid var(--line);border-radius:12px;padding:11px 13px 10px;
  font-size:12.5px;color:var(--dim);max-width:min(74vw,270px);
  box-shadow:0 6px 22px rgba(0,0,0,.28);backdrop-filter:blur(6px)}
#gesHint.show{display:block}
#gesHint b{display:block;color:var(--fg);font-size:13px;margin-bottom:6px}
#gesHint div{display:flex;align-items:center;gap:8px;line-height:1.9}
#gesHint i{font-style:normal;flex:none;min-width:66px;color:var(--fg);font-weight:600}
/* tail 不能继承上面那条 display:flex —— 它是一句会换行的整话, 用 flex 会把
   中间那个图标挤成独立一行 */
#gesHint .tail{display:block;margin-top:7px;padding-top:7px;line-height:1.7;
  border-top:1px solid var(--line);font-size:12px}
/* 全局 .ic 是 display:block, 在这句行内文字里必须改回 inline, 否则图标自己
   独占一行, 一句话被拆成三行 */
#gesHint .tail .ic{display:inline-block;width:15px;height:15px;
  vertical-align:-3.5px;margin:0 2px;color:var(--acc)}
#gesHint button{margin-top:9px;width:100%;padding:6px 0;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--fg);font-size:12.5px}
#gesHint button:active{background:var(--line)}
/* 比例: 网格本身就是尺子, 图例里说明一格多大即可 */
#scale{display:inline-flex;align-items:center;gap:6px;color:var(--fg);font-weight:600;
  padding-left:12px;border-left:1px solid var(--line);cursor:pointer}
#scale .sq{width:11px;height:11px;border:1.5px solid var(--dim);border-radius:2px;flex:none}
/* 摇杆: 右下 */
#joy{right:14px;bottom:14px;width:180px;height:180px;border-radius:50%;padding:0;
  display:flex;align-items:center;justify-content:center;touch-action:none;
  background:
    radial-gradient(circle at 50% 50%, color-mix(in srgb,var(--panel) 88%,transparent) 62%,
                    color-mix(in srgb,var(--panel) 62%,transparent) 100%)}
#joy{border:1px solid var(--line)}
#joy::after{content:'';position:absolute;width:74%;height:74%;border-radius:50%;
  border:1px dashed var(--line);pointer-events:none}
#joy::before{content:'';position:absolute;inset:8px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,var(--line) 0 1deg,transparent 1deg 44deg,
    var(--line) 44deg 45deg,transparent 45deg 89deg,var(--line) 89deg 90deg,
    transparent 90deg 134deg,var(--line) 134deg 135deg,transparent 135deg 179deg,
    var(--line) 179deg 180deg,transparent 180deg 224deg,var(--line) 224deg 225deg,
    transparent 225deg 269deg,var(--line) 269deg 270deg,transparent 270deg 314deg,
    var(--line) 314deg 315deg,transparent 315deg 359deg);
  -webkit-mask:radial-gradient(circle,transparent 0 46%,#000 46% 50%,transparent 50%);
  mask:radial-gradient(circle,transparent 0 46%,#000 46% 50%,transparent 50%);opacity:.8}
#joyKnob{width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#6aa6ff,var(--accent));
  box-shadow:0 4px 16px #2f7ef766,inset 0 -2px 6px #0002;
  transition:background .15s,transform .05s;z-index:1}
#joy.act #joyKnob{background:radial-gradient(circle at 38% 34%,#4ed9a4,var(--ok));
  box-shadow:0 4px 18px #17b97866,inset 0 -2px 6px #0002}
/* 日志: 摇杆正上方 */
/* 日志: 左下角。半透明+等宽, 只做"能扫一眼"的密度 */
/* 与上方实时画面同宽同列(320), 背景比其它浮层更透一档 —— 日志是背景信息,
   不该跟地图抢注意力 */
/* 日志: 底部横向平铺, 右边让开摇杆(180+间距)。默认 5 行, 可展开到 12 行 */
/* 日志: 下方中部 —— 左让开导航面板(14+320+12), 右让开摇杆(180+14+12)。
   默认合并(.min), 需要时点标题栏展开。 */
#logBox{left:346px;right:206px;bottom:14px;display:flex;flex-direction:column;
  padding:0;overflow:hidden;background:color-mix(in srgb,var(--panel) 58%,transparent)}
#logBody{height:calc(5 * 1.55 * 11.5px + 14px)}
#logBox.big #logBody{height:calc(12 * 1.55 * 11.5px + 14px)}
#logHead{display:flex;align-items:center;gap:7px;padding:7px 10px 7px 13px;font-size:11.5px;
  color:var(--dim);border-bottom:1px solid var(--line);flex:none;position:relative}
#logHead::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;
  border-radius:0 3px 3px 0;background:var(--cyan);opacity:.7}
#logHead b{color:var(--fg);font-weight:600;font-size:12px}
#logHead .sp{cursor:pointer;opacity:.6;padding:0 4px}
#logHead .sp:hover{opacity:1}
#logBody{overflow:auto;padding:6px 10px 8px;transition:height .18s;touch-action:pan-y;
  font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);
  white-space:pre-wrap;word-break:break-all}
#logBody::-webkit-scrollbar{width:5px}
#logBody::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
#logBody div{padding:1px 0;border-left:2px solid transparent;padding-left:7px;margin-left:-7px;opacity:.9}
#logBody .e{color:var(--err);border-left-color:var(--err);background:#ec4b4b0f}
#logBody .w{color:var(--warn);border-left-color:var(--warn)}
#logBox.min #logBody{height:0;padding:0}
#logBox.min #logBody{display:none}

/* 导航面板(单点/多点): 按钮列右侧 */
/* 面板紧贴相机下方, 与相机同宽同列 */
/* 底部止于日志上方(日志高180 + 间距) —— 用 top+bottom 约束, 内容多了自己滚,
   不会再压到日志上 */
#navPanel{left:14px;top:0;bottom:14px;width:320px;padding:0;display:none;
  overflow:auto;scrollbar-width:none;touch-action:pan-y}
#navPanel::-webkit-scrollbar{display:none}
#navPanel .ph{display:flex;align-items:center;gap:8px;padding:11px 13px 11px 16px;
  font-size:13px;font-weight:600;border-bottom:1px solid var(--line);position:relative;
  background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
#navPanel .ph::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;
  border-radius:0 3px 3px 0;background:var(--accent)}
#navPanel .ph .x{margin-left:auto;color:var(--dim);cursor:pointer;opacity:.7}
#navPanel .ph .x:hover{opacity:1}
#navPanel .pb{padding:10px 11px}
/* 状态大字: 一眼能看到在干什么 */
.nst{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.nst b{font-size:17px;font-weight:650;letter-spacing:-.3px}
.nst .pill{font-size:11px;padding:2px 8px;border-radius:var(--r-pill);
  background:var(--panel2);color:var(--dim)}
.nst.run b{color:var(--accent)} .nst.ok b{color:var(--ok)} .nst.bad b{color:var(--err)}
/* 两列指标 */
.mets{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:9px}
.met{background:var(--panel2);border-radius:9px;padding:6px 8px}
.met small{display:block;color:var(--dim);font-size:11px;margin-bottom:2px}
.met b{font-size:14px;font-weight:650;font-family:var(--mono);letter-spacing:-.4px}
.met b.sm{font-size:12px}   /* 坐标那种两段式的数字, 14px 会挤到换行 */
.hintline{font-size:11.5px;color:var(--dim);line-height:1.5;margin:0 0 10px}
.wp-list{max-height:150px;overflow:auto;margin:0 0 9px;
  border:1px solid var(--line);border-radius:10px}
.wp-list:empty{display:none}
.wp{display:flex;align-items:center;gap:9px;padding:6px 9px;font-size:12px;
  border-bottom:1px solid var(--line)}
.wp:last-child{border-bottom:none}
.wp:hover{background:var(--panel2)}
.wp .n{width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;font-weight:600}
.wp .co{font-variant-numeric:tabular-nums;color:var(--dim)}
.wp .d{margin-left:auto;color:var(--dim2);cursor:pointer;padding:2px}
.wp .d:hover{color:var(--err)}
.wp.cur{background:var(--accent-soft)}
.wp.cur .co{color:var(--fg)}
.row{display:flex;gap:7px;margin-top:7px}
.row button{flex:1;padding:9px;border-radius:10px;background:var(--panel2);font-size:12.5px;
  font-weight:600;transition:.15s}
.row button:hover{background:var(--line)}
.row button.primary{background:var(--accent);color:#fff}
.row button.primary:hover{filter:brightness(1.08)}
.row button.danger{background:#ec4b4b1a;color:var(--err)}
.row button:disabled{opacity:.35;cursor:not-allowed}

/* ---------------- 弹窗 ---------------- */
#mask{position:fixed;inset:0;background:#0006;backdrop-filter:blur(3px);z-index:80;
  display:none;align-items:center;justify-content:center;padding:16px}
#mask.show{display:flex}
.dlg{background:var(--panel);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;
  max-width:420px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.dlg h3{margin:0;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px}
.dlg h3 .x{margin-left:auto;cursor:pointer;color:var(--dim)}
.dlg .body{padding:14px 16px;overflow:auto;touch-action:pan-y}
.dlg .foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.dlg .foot button{flex:1;padding:9px;border-radius:10px;background:var(--panel2);font-weight:600}
.dlg .foot button.primary{background:var(--accent);color:#fff}
.fld{margin-bottom:14px}
.fld label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:5px}
.fld label b{color:var(--fg)}
.fld input[type=range]{width:100%;accent-color:var(--accent)}
.fld input[type=text]{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);font:inherit}
.sw{display:flex;align-items:center;justify-content:space-between;padding:9px 0}
.sw .t{font-size:13px}
.sw .t small{display:block;color:var(--dim);font-size:11px}
.tgl{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;
  transition:.18s;cursor:pointer}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:.18s;box-shadow:0 1px 3px #0003}
.tgl.on{background:var(--ok)}
.tgl.on::after{transform:translateX(18px)}
.maprow{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:12px;
  cursor:pointer;transition:.14s}
.maprow:hover{background:var(--panel2)}
.maprow:active{transform:scale(.995)}
.maprow.sel{background:var(--accent-soft)}
.maprow .mi{flex:1;min-width:0}
.maprow .mi b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maprow .mi small{color:var(--dim);font-size:11px}
.maprow .act{color:var(--dim);padding:4px}
.maprow.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{0%,60%{background:var(--ok-soft)}100%{background:transparent}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);z-index:90;
  background:#000d;backdrop-filter:blur(8px);color:#fff;padding:11px 18px;
  border-radius:var(--r-pill);font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#dc2626e6}
@media (max-width:640px){
  #pip{width:190px} #navPanel{width:190px}
  #logBox{left:212px;right:162px} #joy{width:140px;height:140px}
  #navPanel{bottom:14px} #legend{left:auto;right:70px;width:auto;max-width:60%}
  #tools{bottom:168px;width:48px} .tool{width:36px;height:36px}
  #legend{max-width:calc(100% - 250px);font-size:10px}
  #status .chip.hide-s{display:none}
}

<script>
'use strict';
const $=id=>document.getElementById(id);
const DPR=Math.min(2,window.devicePixelRatio||1);

/* ============ 全局状态 ============
   S = 后端 push 的 state; UI = 纯前端的界面状态(不进后端) */
const S={mode:'idle',sensor:'mid360',running:false,external:false,stopping:false,
         active_map:'',voltage:null,pcd_count:0,wifi:null,detected:null};
const UI={route:'home',   // home | nav | map | maps | settings
          mode:'nav',     // 画布用: 'nav'(2D地图) | 'map'(3D点云), 由 route 派生
          pipMain:false,        // false=地图为主画面, true=相机为主画面
          panel:'',             // '' | 'goal' | 'wps'
          layers:Object.assign({costmap:true,plan:true,local:true,scan:true},
                    JSON.parse(localStorage.getItem('v2layers')||'{}')),
          sound:localStorage.getItem('v2sound')!=='0',
          vx:+(localStorage.getItem('v2vx')||0.35),      // 遥控线速度上限 m/s
          wz:+(localStorage.getItem('v2wz')||1.0),       // 遥控角速度上限 rad/s
          selMap:localStorage.getItem('v2selMap')||''};
let navT0=null;
/* 导航的终态(含被拒绝)。后端发的是 nav2 原词, 在 onJson 里已翻译成这套。 */
const NAV_END=['succeeded','failed','canceled','rejected','idle'];
let maps=[], nav={state:'idle'}, robot={ok:false,x:0,y:0,yaw:0,frame:''};
let ws=null, connected=false;
/* 刚连上的那一瞬间后端会补发: 当前 state、当前 nav_info、最近100条日志。
   那些是**历史**, 不是刚发生的事 —— 不设这个门, 每次刷新页面/掉线重连都会把
   上一次导航的"已到达目标"、日志里的"重定位成功"重新念一遍。见 speak()。 */
let wsOpenAt=0;

/* ============ WebSocket ============ */
function send(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.binaryType='arraybuffer';
  ws.onopen=()=>{connected=true;wsOpenAt=Date.now();toast('已连接小车');
                 send({t:'list_maps',sensor:'mid360'});
                 send({t:'cam',on:!$('pip').classList.contains('fold')});
                 // 断线重连后后端的 scene_want 已经清了(没客户端就退回1Hz),
                 // 实景开着的话要重新告诉它, 否则点云会莫名其妙变回一秒一跳
                 if(C3.scene)send({t:'scene',on:true});
                 renderAll();};
  ws.onclose=()=>{connected=false;renderAll();setTimeout(connect,1500);};
  ws.onmessage=e=>{ if(typeof e.data==='string') onJson(JSON.parse(e.data)); else onBin(e.data); };
}
function onJson(m){
  if(m.t==='state'){
    const wasRunning=S.running, oldMode=S.mode;
    Object.assign(S,m);
    // 后端实测的地面平面(见 app.py GroundFitter)。法向/高度一变, 已上传的点云
    // 筛选结果就作废了 —— 高度带是按这个平面算的
    if(m.ground){
      const g=C3.gnd;
      if(!g||g.fit!==m.ground.fit||Math.abs(g.z-m.ground.z)>0.005||
         Math.abs(g.nx-m.ground.nx)>0.002||Math.abs(g.ny-m.ground.ny)>0.002){
        C3.gnd=m.ground;cloudDirty=liveDirty=true;draw3d();
      }else C3.gnd=m.ground;
    }
    pushHist();                  // 首页磁贴的趋势条只在这里采样(约2秒一个点)
    // 任务状态跃迁时播报(语音条目见 SPEAK 表)
    if(S.running&&!wasRunning) speak('start_'+S.mode);
    if(!S.running&&wasRunning) speak('stop_'+oldMode);
    renderAll();
  }
  else if(m.t==='map_saved'){
    // 编的正好是导航此刻在用的那张图 -> 问一句要不要立刻热加载。
    // 不问就默默生效太吓人; 不给这个入口又得重启整套导航才看得到效果。
    if(m.active&&confirm(`"${m.name}" 正被导航使用, 现在就热加载生效吗?\n`
        +'(只换 map_server 的图, 不重启导航)')) send({t:'reload_map',name:m.name});
  }
  else if(m.t==='log') pushLog(m.line);
  else if(m.t==='toast') toast(m.msg,!m.ok&&m.ok!==undefined);
  else if(m.t==='maps'){
    maps=m.maps||[];
    /* 【删掉的图还挂在首页"当前地图"上】selMap 存在 localStorage 里, 图删了它
       不会自己消失, 首页和地图库就一直显示一个已经不存在的名字, 启动导航还会
       拿它当参数(后端找不到文件 -> 加载失败)。每次拿到新列表都核对一遍。 */
    if(UI.selMap&&!maps.some(x=>x.name===UI.selMap)){
      const gone=UI.selMap;
      UI.selMap=''; localStorage.removeItem('v2selMap');
      toast(`地图 "${gone}" 已不存在, 已取消选中`,true);
    }
    renderMapDlg(); renderStatus(); renderHome(); }
  else if(m.t==='map_preview'){ toast('已加载地图 '+m.name); fitMap(); draw(); }
  else if(m.t==='nav_params'){ applyNavParams(m); }
  else if(m.t==='pose'){
    const first=!robot.ok;
    robot={ok:true,x:m.x,y:m.y,z:m.z||0,yaw:m.yaw,frame:m.frame};
    // 导航起来后的第一个位姿 = 默认起点(用户没手动设过的话)
    if(first&&!homePose&&S.mode==='navigation')setHome({x:m.x,y:m.y,yaw:m.yaw});
    if(follow){view.cx=robot.x;view.cy=robot.y;}
    // 面板里的"当前位置/当前朝向"必须跟着位姿走。以前只有 navT0 有值时那个
    // 每秒的定时器才会重画面板, 所以没在导航时这两个数字是死的(用户反馈"不能实时显示")
    draw(); if(UI.route==='map')draw3d(); renderStatus(); updatePanelLive(); }
  else if(m.t==='nav'){
    const was=nav.state, wasWp=nav.wp_index;
    nav={...nav,...m};
    /* 【已到达了还显示剩余距离】nav 是 {...nav,...m} 合并上来的, 后端进终态那条
       消息里通常不带 dist, 于是上一条 running 的 dist 就一直留着不动。
       终态下"剩余距离"没有意义, 直接清掉。 */
    if(NAV_END.includes(m.state==='active'?'running':m.state==='aborted'?'failed':m.state))
      nav.dist=null;
    /* 后端(app.py set_nav)用的是 nav2 action 的原词: active / aborted, 航点字段叫
       wp_index(0基); 而界面这边一路写的是 running / failed 和 index(1基) —— 两套词
       从来没对上, 结果是状态标签、航点高亮、失败播报全都不生效。在入口处翻译一次,
       下游只认界面这套词。 */
    if(nav.state==='active')nav.state='running';
    if(nav.state==='aborted')nav.state='failed';
    if(nav.wp_index!=null)nav.index=nav.wp_index+1;   // "正在前往第 N 个航点"
    // 后端不一定每帧都带 elapsed, 自己记开始时刻兜底(之前"已用时"一直是 --)
    if(nav.state==='running'&&!navT0)navT0=Date.now();
    if(NAV_END.includes(nav.state))navT0=null;
    /* 【设了目标点反而看不到图标 / 面板上目标坐标空着】以前这里是
         if(NAV_END.includes(nav.state)&&goal) goal=null;
       每收到一条 nav 就判一次, 而后端在**新目标还没被 action server 接受之前**
       会先补发一条带着上一次终态(succeeded/canceled)的 nav —— 于是刚放下的
       目标点当场被抹掉, 表现就是"点完地图什么都没出现"。
       现在改成: 目标点一直留着, 只标记它已经完成; 真正清掉只在
       取消(cancelGoal)和下一次设定目标时发生。到达后仍能看见自己去了哪。
       【2026-08-08 再改】"一直留着"又太久了: 到点很久以后那个标记还杵在图上,
       开多点巡航时和航点混在一起看不清(用户反馈)。改成打完 done 标记后
       起一个 10 秒的定时器自动收起 —— 既看得到"到了", 也不会一直挂着。 */
    if(NAV_END.includes(nav.state)&&goal&&goal.done!==nav.state)goalMarkDone(nav.state);
    if(nav.state==='running'&&goal){goal.done=null;goalHoldCancel();}
    onNavUpdate(was,wasWp); draw(); renderPanel(); }
  else if(m.t==='scanpose'){ scanPose=m; }
  else if(m.t==='clear'){ clearLayers(m.what); }
}
/* 二进制帧: 首字节是类型, 见 app.py 顶部的 B_* 常量 */
let mapImg=null,mapMeta=null,cmImg=null,cmMeta=null;
let scanPts=null,planPts=null,localPts=null;
/* 这一帧激光对应时刻的车体位姿(后端按 scan 的时间戳查 TF 发来的)。
   用它而不是最新的 robot ——两者频率不同, 车转起来会差一帧的角度,
   表现就是激光整体持续偏转。 */
let scanPose=null;
const cloud={pos:new Float32Array(3*300000),n:0};   // 3D点云(建图模式, 一路累积)
/* 【实景滚动窗口】累积点云回答的是"这块地方扫到没有", 看的是覆盖率;
   实景要回答的是"我周围现在长什么样", 两者需求相反 —— 累积图里人走一趟会拖出
   一条长带, 家具搬走了也还留在那儿。所以实景另存最近 SCENE_KEEP 帧, 到点就丢,
   画在累积点云上面(累积的压暗当背景)。后端在实景模式下把点云提到 5Hz/2500点,
   所以这个窗口约等于最近 2~3 秒。 */
const SCENE_KEEP=12;
const live={frames:[],n:0};
let liveDirty=false;
let traj=[];
function onBin(buf){
  const t=new Uint8Array(buf,0,1)[0];
  if(t===1||t===6){                                  // 地图 / 代价地图: meta+png
    const len=new DataView(buf,1,4).getUint32(0,true);
    const meta=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,5,len)));
    const url=URL.createObjectURL(new Blob([new Uint8Array(buf,5+len)],{type:'image/png'}));
    const img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);
      if(t===1){mapImg=img;mapMeta=meta;if(!robot.ok)fitMap();}else{cmImg=img;cmMeta=meta;}
      draw();};
    img.src=url;
  }
  else if(t===7){                                    // 编辑用的精确三色图
    const len=new DataView(buf,1,4).getUint32(0,true);
    const meta=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,5,len)));
    const url=URL.createObjectURL(new Blob([new Uint8Array(buf,5+len)],{type:'image/png'}));
    const img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);edOpen(meta,img);};
    img.src=url;
  }
  else if(t===2){scanPts=new Float32Array(buf.slice(1));draw();}
  else if(t===4){planPts=new Float32Array(buf.slice(1));draw();}
  else if(t===8){localPts=new Float32Array(buf.slice(1));draw();}
  else if(t===5){const a=new Float32Array(buf.slice(1));
    for(let i=0;i<a.length;i+=2)traj.push(a[i],a[i+1]);
    if(traj.length>40000)traj.splice(0,traj.length-40000);draw();}
  else if(t===3){                                    // 点云 xyz 三元组 -> 3D
    const a=new Float32Array(buf.slice(1));
    for(let i=0;i+2<a.length;i+=3){
      if(cloud.n*3+3>cloud.pos.length){              // 环形覆盖最旧的 1/4
        cloud.n=Math.floor(cloud.pos.length/3*0.75);
        cloud.pos.copyWithin(0,cloud.pos.length-cloud.n*3);
      }
      cloud.pos[cloud.n*3]=a[i];cloud.pos[cloud.n*3+1]=a[i+1];cloud.pos[cloud.n*3+2]=a[i+2];
      cloud.n++;
    }
    // 同一帧也进实景滚动窗口(不额外占带宽, 就是同一份数据换个留存策略)
    live.frames.push(a);
    while(live.frames.length>SCENE_KEEP)live.frames.shift();
    live.n=live.frames.reduce((s,f)=>s+(f.length/3|0),0);
    liveDirty=true;
    cloudDirty=true;draw3d();
  }
  else if(t===9){showCam(buf);}
}
function clearLayers(what){
  planPts=localPts=null;traj=[];cmImg=null;
  if(what==='mapping'){mapImg=null;mapMeta=null;cloud.n=0;cloudDirty=true;
    live.frames=[];live.n=0;liveDirty=true;}
  draw();draw3d();
}

/* ============ 路由 ============
   五个页面: 首页 / 导航 / 建图 / 地图库 / 设置。
   导航和建图共用 #stage(画布+浮层), 靠 UI.mode 决定画 2D 还是 3D。 */
const TITLES={nav:'导航',map:'建图',maps:'地图库',settings:'设置',edit:'地图编辑'};
function go(r){
  // 任务在跑时不许离开对应的页面 —— 离开了操作入口就没了, 容易忘记停止
  if(busy()&&UI.route!=='home'&&r==='home'&&
     ((S.mode==='navigation'&&UI.route==='nav')||(S.mode==='mapping'&&UI.route==='map'))){
    if(!confirm('任务仍在运行, 确定回首页? (任务不会停止, 可从首页再进来)'))return;
  }
  // 编辑没保存就走人 = 白画。撤销栈只在浏览器里, 离开这页就没了
  if(UI.route==='edit'&&r!=='edit'&&ED.dirty&&
     !confirm('地图改了还没保存, 确定离开? 修改会全部丢失。'))return;
  if(UI.route==='edit'&&r!=='edit')ED.open=false;
  UI.route=r;
  if(r==='nav'||r==='map')UI.mode=r;
  UI.panel='';
  $('home').classList.toggle('show',r==='home');
  $('top').style.display=r==='home'?'none':'flex';
  $('stage').style.display=(r==='nav'||r==='map')?'block':'none';
  $('pgMaps').classList.toggle('show',r==='maps');
  $('pgSet').classList.toggle('show',r==='settings');
  $('pgEdit').classList.toggle('show',r==='edit');
  $('title').textContent=TITLES[r]||'';
  if(r!=='edit')$('edHint').classList.remove('show');
  if(r==='maps'){send({t:'list_maps',sensor:'mid360'});renderMapsPage();}
  if(r==='settings')renderSetPage();
  // 离开建图页就退掉实景的高帧率推送 —— 页面看不见了还占着无线带宽没意义。
  // 回来时不自动恢复: 实景是要主动开的东西, 悄悄替用户开着才更让人意外。
  if(r!=='map'&&C3.scene){C3.scene=false;live.frames=[];live.n=0;send({t:'scene',on:false});}
  if(r==='map')showGesHint(); else $('gesHint').classList.remove('show');
  renderAll();
  if(r==='nav'||r==='map')resize();
  if(r==='edit')edResize();
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
// 编辑页是从地图库进来的, 返回就回地图库(回首页要再点两下才能接着改下一张)
$('back').onclick=()=>go(UI.route==='edit'?'maps':'home');
/* 手势速查卡: 只在没被"知道了"关掉过时露出来。手势变了(加了新的)就把
   localStorage 的键改个版本号, 让老用户再看一次。 */

}
$('gesOk').onclick=()=>{localStorage.setItem('v3ges2','1');

/* ============ 首页 ============ */
function fmtUp(sec){
  if(sec==null)return '--';
  const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);
  return d?`${d}天${h}小时`:(h?`${h}小时${m}分`:`${m}分钟`);
}
/* 时钟走本地秒表, 但基准用小车回传的系统时间(S.now) —— 平板和小车的时钟未必一致,
   这里显示的应该是小车的时间。 */
let clockBase=null;
setInterval(()=>{
  const t=$('hTime');if(!t||UI.route!=='home')return;
  if(S.now!=null&&clockBase==null)clockBase={srv:S.now,loc:Date.now()/1000};
  const now=clockBase?new Date((clockBase.srv+(Date.now()/1000-clockBase.loc))*1000):new Date();
  const p=n=>String(n).padStart(2,'0');
  t.textContent=`${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
  const wk='日一二三四五六'[now.getDay()];
  $('hDate').textContent=`${now.getMonth()+1}月${now.getDate()}日 周${wk}`;
  $('hUpV').textContent=fmtUp(S.uptime);
},1000);

/* ---- 指标趋势 ----
   采样挂在**收到 state 时**(约2秒一条), 不放在 renderHome 里: renderHome 在别的
   页面会整个跳过(采不到样), 而 renderAll 又会被别的事件带着跑, 频率对不上。 */
const HN=40;                    // 40 个样本 ≈ 最近 80 秒
const hist={bat:[],cpu:[],mem:[],disk:[],temp:[]};
function pushHist(){
  const put=(k,v)=>{if(v==null||isNaN(v))return;
    const a=hist[k];a.push(+v);if(a.length>HN)a.shift();};
  put('bat',S.voltage);
  put('cpu',S.cpu_pct);
  put('mem',S.mem_total?S.mem_avail/S.mem_total*100:null);
  put('disk',S.disk_total?S.disk_free/S.disk_total*100:null);
  put('temp',S.cpu_temp);
}
/* 迷你趋势条。量程写死(lo,hi)而不是按历史 min/max 自适应 —— 自适应的话
   "一直 90%" 和 "一直 10%" 画出来一模一样, 看不出高低, 只剩噪声形状。 */
function spark(a,lo,hi){
  if(!a||a.length<2)return '';
  const W=100,H=20,n=a.length;
  const y=v=>(H-Math.max(0,Math.min(1,(v-lo)/(hi-lo)))*H).toFixed(2);
  const x=i=>(i/(n-1)*W).toFixed(2);
  const pts=a.map((v,i)=>x(i)+','+y(v)).join(' ');
  return `<svg class="spk" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`
    +`<polygon class="ar" points="0,${H} ${pts} ${W},${H}"/>`
    +`<polyline class="ln" points="${pts}"/></svg>`;
}
/* 一块磁贴。cls 为 ''/ok/warn/err, 同时决定数值颜色、左侧色条和趋势线颜色。
   副标题(sub)跟标题同一行靠右, 底部整幅留给趋势曲线。 */
function tile(ic,label,val,unit,sub,cls,sp){
  return `<div class="tile ${cls||''}">
    <div class="th"><svg class="ic"><use href="#${ic}"/></svg><span class="tn">${label}</span>
      <span class="ts" title="${sub}">${sub}</span></div>
    <div class="tv">${val}${unit?`<i>${unit}</i>`:''}</div>${sp||''}</div>`;
}
function renderHome(){
  if(UI.route!=='home')return;
  if(S.now!=null&&clockBase==null)clockBase={srv:S.now,loc:Date.now()/1000};
  const navOn=S.running&&S.mode==='navigation', mapOn=S.running&&S.mode==='mapping';
  $('hDot').className='dot '+(connected?'on':'off');
  $('hSub').textContent=connected
    ? (S.running?`${TITLES[S.mode==='navigation'?'nav':'map']||S.mode} 运行中`:'已连接 · 空闲')
    : '连接断开, 正在重连…';
  $('tagNav').style.display=navOn?'flex':'none';
  $('tagMap').style.display=mapOn?'flex':'none';

  /* ---- 2×3 磁贴 ----
     副标题现在待在右上角那条窄缝里(960 宽的平板上只有 ~100px), 所以措辞要短 ——
     超了会被 ellipsis 截掉, 而平板上没有 hover 看不到 title。 */
  const t=[];
  // 电量: 12V/24V 包的阈值不一样, 按读数自己判断(见 BAT)
  const bat=S.voltage, B=BAT(bat==null?0:bat);
  /* 电压是底盘串口发上来的, 所以这块磁贴同时就是"底盘在没在线"的指示 ——
     底下的状态胶囊里不要再放一个"底盘 未启动", 用户反馈重复了。 */
  t.push(tile('i-charge','电量', bat!=null?bat.toFixed(1):'--', bat!=null?'V':'',
    bat==null?'底盘未启动':(bat<B.err?'过低, 请立即充电':bat<B.warn?'偏低':'电压正常'),
    bat==null?'':(bat<B.err?'err':bat<B.warn?'warn':'ok'),
    spark(hist.bat,B.lo,B.hi)));
  // CPU
  const cpu=S.cpu_pct;
  t.push(tile('i-chip','CPU', cpu!=null?cpu.toFixed(0):'--', cpu!=null?'%':'',
    '8核 A76+A55',
    cpu==null?'':(cpu>=90?'err':cpu>=70?'warn':''), spark(hist.cpu,0,100)));
  // 内存(本机只有4G, 编译/建图时最容易出事, 所以显示的是"可用"而不是"已用")
  t.push(tile('i-mem','内存', S.mem_avail!=null?S.mem_avail.toFixed(1):'--',
    'GB 可用', S.mem_total?`共 ${S.mem_total} GB`:'--',
    S.mem_avail==null?'':(S.mem_avail<0.6?'err':S.mem_avail<1.2?'warn':''),
    spark(hist.mem,0,100)));
  // 磁盘: 换算成"还能建多少分钟图"比 GB 直观(建图约 100MB/分钟, 留 2G 安全余量)
  const mins=S.disk_free!=null?Math.max(0,Math.round((S.disk_free-2)/0.1)):null;
  t.push(tile('i-hdd','磁盘', S.disk_free!=null?S.disk_free.toFixed(1):'--',
    'GB 可用', mins!=null?`可建图 ${mins} 分钟`:'--',
    S.disk_free==null?'':(S.disk_free<2?'err':S.disk_free<5?'warn':''),
    spark(hist.disk,0,100)));
  // 温度
  const tp=S.cpu_temp;
  t.push(tile('i-temp','温度', tp!=null?tp.toFixed(0):'--', tp!=null?'℃':'',
    tp!=null&&tp>=85?'已降频':'超过 85℃ 会降频',
    tp==null?'':(tp>=85?'err':tp>=75?'warn':''), spark(hist.temp,30,95)));
  // 网络: 两块网卡各一行(板载跑站点/USB跑热点, 见 CLAUDE.md), 没有"一个数"可显示
  const w=S.wifi||{}, sta=w.sta||{}, ap=w.ap||{};
  t.push(`<div class="tile net ${sta.up?'':'warn'}">
    <div class="th"><svg class="ic"><use href="#i-wifi"/></svg><span class="tn">网络</span>
      <span class="ts">${sta.up?esc(sta.ip||''):'仅热点可达'}</span></div>
    <div class="nw">
      <div class="nr"><span class="dot ${sta.up?'on':'off'}"></span>
        <span class="k">WiFi</span><b>${sta.up?esc(sta.name||'已连接'):'未连接'}</b></div>
      <div class="nr"><span class="dot ${ap.up?'on':'off'}"></span>
        <span class="k">热点</span><b>${ap.up?esc(ap.ssid||'已开启')+' · '+(ap.clients||0)+'台':'未开启'}</b></div>

  $('hTiles').innerHTML=t.join('');

  /* ---- 状态胶囊: 只放磁贴里没有的东西(底盘状态已经由电量磁贴表达) ---- */

  /* 【"当前地图"到底该显示哪个】导航跑着的时候, 真正加载的是 active_map(启动那一刻
     定死的), 用户之后再点别的图只是改"下次用哪张" —— 所以运行中必须 active_map 优先,
     否则会显示一个根本没在用的名字。空闲时才显示选中的那张。 */
  const curMap=esc(mapNameNow());
  $('sbNav').textContent=navOn
    ? `${navText()} · 地图 ${curMap} · 已用 ${elapsedTxt()}`
    : `当前地图 ${curMap} · 单点/多点自动导航`;
  $('sbMap').textContent=mapOn
    ? `建图中 · 已存 ${S.pcd_count||0} 段点云`
    : (S.mode==='save_map'&&S.running ? '正在转换 2D 地图…'
       : `MID360s 三维建图${mins!=null?` · 磁盘约够 ${mins} 分钟`:''}`);
  $('sbMaps').textContent=`地图库 ${maps.length} 张 · `
    +(UI.selMap?`已选 ${esc(UI.selMap)}`:'未选择');
  $('sbSet').textContent=`语音 ${UI.sound?'开':'关'} · 热点 ${ap.up?'开':'关'}`
    +` · 遥控 ${UI.vx.toFixed(2)} m/s`;
  $('hmNav').textContent=navOn?navText():(S.running?'其它任务':'未启动');
  $('hmMap').textContent=S.pcd_count||0;

  const box=$('tools');box.innerHTML='';

/* 长按(触屏)或悬停(桌面)显示说明 —— 图标按钮不写字, 全靠这个 */
function bindTip(el,text){
  // 文案存 dataset、监听只挂一次: syncVTool 会对同一个按钮反复调本函数来换文案
  // (单指手势那个按钮), 每次都挂一遍监听的话按一下会弹好几层
  el.dataset.tip=text;
  if(el._tipBound)return;
  el._tipBound=true;
  let timer=null;
  const show=()=>{const t=$('tip');t.textContent=el.dataset.tip;t.classList.add('show');
    const r=el.getBoundingClientRect();
    // 按钮列在右侧, 提示要弹到左边去, 否则会跑出屏幕
    t.style.left='';t.style.right=(innerWidth-r.left+8)+'px';
    t.style.top=(r.top+r.height/2-14)+'px';};
  const hide=()=>$('tip').classList.remove('show');
  el.addEventListener('mouseenter',show);el.addEventListener('mouseleave',hide);
  el.addEventListener('touchstart',()=>{timer=setTimeout(show,380);},{passive:true});
  el.addEventListener('touchend',()=>{clearTimeout(timer);hide();});
  el.addEventListener('touchmove',()=>{clearTimeout(timer);});
}

/* ============ 布局(浮层位置随模式/画中画变化) ============ */
function layout(){
  const pip=$('pip'),np=$('navPanel');
  const pipH=pip.offsetHeight||200;
  np.style.top=(14+pipH+8)+'px';   // 面板紧跟画面下方, 画面收起后自动上移
  np.style.display=UI.panel?'block':'none';
  $('joy').style.display=UI.mode==='nav'||UI.mode==='map'?'flex':'none';
  // 主画面切换: 画中画里放另一个
  const camMain=UI.pipMain;
  $('cv2d').style.display=(UI.mode==='nav'&&!camMain)?'block':'none';
  $('cv3d').style.display=(UI.mode==='map'&&!camMain)?'block':'none';
  $('pipImg').style.display=camMain?'none':'';
  $('pipMini').style.display=camMain?'block':'none';
  $('pipLabel').textContent=camMain?(UI.mode==='nav'?'地图':'点云'):'实时画面';
  if(camMain){ // 相机变主画面 -> 铺满 stage(有独立的缩放状态, 不动地图视图)
    if(!$('camFull'))makeCamFull();
    $('camFull').style.display='block';applyCamView();
  }else if($('camFull')) $('camFull').style.display='none';
  if(camMain)drawMini();
}
/* 相机作主画面: 用一个独立的缩放/平移状态, **只作用于这张图**。
   之前是把整个画布一起缩放, 结果画面和地图纠缠在一起 —— 实际想要的只是
   "把画面放大点看清楚"。双击(或双指双击)复位。 */
const camView={z:1,x:0,y:0};
function makeCamFull(){
  const box=document.createElement('div');box.id='camFull';
  box.style.cssText='position:absolute;inset:0;background:#000;overflow:hidden;touch-action:none';
  const i=document.createElement('img');i.id='camFullImg';
  i.style.cssText='position:absolute;left:50%;top:50%;max-width:none;transform-origin:center;'+
    'user-select:none;-webkit-user-drag:none';
  box.append(i);$('stage').prepend(box);
  bindCamZoom(box,i);
  return box;
}
function applyCamView(){
  const i=$('camFullImg');if(!i)return;
  i.style.transform=`translate(-50%,-50%) translate(${camView.x}px,${camView.y}px) scale(${camView.z})`;
}
function bindCamZoom(box,img){
  // 图片首次加载后按"contain"铺满
  img.onload=()=>{const r=box.getBoundingClientRect();
    const k=Math.min(r.width/img.naturalWidth,r.height/img.naturalHeight);
    img.style.width=(img.naturalWidth*k)+'px';img.style.height=(img.naturalHeight*k)+'px';
    applyCamView();};
  let drag=false,lx=0,ly=0,pd=0;
  box.addEventListener('wheel',e=>{e.preventDefault();
    camView.z=Math.max(1,Math.min(8,camView.z*(1-Math.sign(e.deltaY)*0.15)));
    if(camView.z===1){camView.x=camView.y=0;}
    applyCamView();},{passive:false});
  box.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;
    box.setPointerCapture(e.pointerId);});
  box.addEventListener('pointermove',e=>{if(!drag||camView.z<=1)return;
    camView.x+=e.clientX-lx;camView.y+=e.clientY-ly;lx=e.clientX;ly=e.clientY;applyCamView();});
  box.addEventListener('pointerup',()=>drag=false);
  box.addEventListener('dblclick',()=>{camView.z=1;camView.x=camView.y=0;applyCamView();});
  box.addEventListener('touchstart',e=>{if(e.touches.length===2)pd=td(e);},{passive:true});
  box.addEventListener('touchmove',e=>{
    if(e.touches.length!==2)return;e.preventDefault();
    const d=td(e);camView.z=Math.max(1,Math.min(8,camView.z*d/pd));pd=d;
    if(camView.z===1){camView.x=camView.y=0;}applyCamView();},{passive:false});
  function td(e){return Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                                   e.touches[0].clientY-e.touches[1].clientY);}
}

/* ============ 2D 地图画布(导航模式) ============ */
const cv=$('cv2d'),ctx=cv.getContext('2d');
let W=0,H=0,view={cx:0,cy:0,scale:28,rot:0};
let follow=false, showGrid=localStorage.getItem('v2grid')!=='0';
function resize(){
  for(const c of [cv,$('cv3d')]){
    const r=$('stage').getBoundingClientRect();
    c.width=r.width*DPR;c.height=r.height*DPR;
    c.style.width=r.width+'px';c.style.height=r.height+'px';
  }
  W=cv.width/DPR;H=cv.height/DPR;
  if(gl){gl.viewport(0,0,$('cv3d').width,$('cv3d').height);}
  layout();draw();draw3d();
  if(UI.route==='edit')edResize();      // 编辑页有自己的画布, 转屏时也得跟着重算
}
/* 世界<->屏幕。view.rot = 地图旋转角(0 为正北朝上)。所有图元都过这两个函数,
   所以转地图时激光/路径/标记会跟着一起转。 */
/* 视图中心不放在画面正中, 而是往右偏一点 —— 左边有相机/面板/日志三层浮层,
   居中的话地图内容老是被挡住。窄屏时不偏(本来就没地方)。 */
function cxOff(){return W>760?110:0;}
function w2s(x,y){
  const dx=x-view.cx, dy=y-view.cy, c=Math.cos(view.rot), sn=Math.sin(view.rot);
  return [(dx*c-dy*sn)*view.scale+W/2+cxOff(), H/2-(dx*sn+dy*c)*view.scale];
}
function s2w(sx,sy){
  const rx=(sx-W/2-cxOff())/view.scale, ry=(H/2-sy)/view.scale;
  const c=Math.cos(view.rot), sn=Math.sin(view.rot);
  return [view.cx+rx*c+ry*sn, view.cy-rx*sn+ry*c];
}
function fitMap(){
  if(!mapMeta)return;
  follow=false;syncVTool();
  view.cx=mapMeta.ox+mapMeta.w*mapMeta.res/2;
  view.cy=mapMeta.oy+mapMeta.h*mapMeta.res/2;
  // 可用宽度要扣掉左边浮层和右边按钮列
  view.scale=Math.max(5,Math.min(140,Math.min((W-(W>760?420:60))/(mapMeta.w*mapMeta.res),
                                              H*.86/(mapMeta.h*mapMeta.res))));
  draw();
}
let drawReq=false;
function draw(){if(drawReq)return;drawReq=true;requestAnimationFrame(_draw);}
function _draw(){
  drawReq=false;
  if(UI.mode!=='nav'){return;}
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--bg');
  ctx.fillRect(0,0,W,H);
  if(showGrid)drawGrid();
  updateScale();
  if(mapImg&&mapMeta){
    const [px,py]=w2s(mapMeta.ox,mapMeta.oy+mapMeta.h*mapMeta.res);
    ctx.save();ctx.translate(px,py);ctx.rotate(-view.rot);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(mapImg,0,0,mapMeta.w*mapMeta.res*view.scale,mapMeta.h*mapMeta.res*view.scale);
    ctx.restore();
  }
  // 代价地图: 后端已把原点转到 map 系并给了两系偏航角(局部图发在 odom_combined),
  // 必须按 yaw 旋转着画, 否则车一转弯整片错开
  if(UI.layers.costmap&&cmImg&&cmMeta){
    const cw=cmMeta.w*cmMeta.res*view.scale, ch=cmMeta.h*cmMeta.res*view.scale;
    const [px,py]=w2s(cmMeta.ox,cmMeta.oy);
    ctx.save();ctx.translate(px,py);ctx.rotate(-view.rot-(cmMeta.yaw||0));
    ctx.imageSmoothingEnabled=false;ctx.drawImage(cmImg,0,-ch,cw,ch);ctx.restore();
  }
  // /scan 是 base_footprint 系(后端 _scan_xy 直接给的极坐标转直角, 没转 map),
  // 必须按车体位姿旋转平移过去 —— 不转的话激光点会绕着地图原点转, 跟障碍对不齐
  if(UI.layers.scan&&scanPts&&(scanPose||robot.ok))scanDots();
  if(UI.layers.plan&&planPts)   line(planPts,'#22c55e',2.5);
  if(UI.layers.local&&localPts) line(localPts,'#f59e0b',2.5);
  // 到达/失败后目标点不清除, 只换个颜色: 绿=已到达, 红=失败/被拒, 蓝=进行中
  if(goal)  markDir(goal.x,goal.y,goal.yaw||0,
      goal.done==='succeeded'?'#22c55e':
      (goal.done==='failed'||goal.done==='rejected')?'#ef4444':'#2f7ef7');
  wps.forEach((p,i)=>markDir(p.x,p.y,p.yaw||0,'#8b5cf6',i+1));
  if(pick)  markDir(pick.x,pick.y,pick.yaw,pick.drag?'#f59e0b':'#94a3b8');

}
function scanDots(){
  const P=scanPose||robot;
  const c=Math.cos(P.yaw),sn=Math.sin(P.yaw);
  ctx.fillStyle='#ef4444';
  for(let i=0;i+1<scanPts.length;i+=2){
    const wx=P.x+scanPts[i]*c-scanPts[i+1]*sn;
    const wy=P.y+scanPts[i]*sn+scanPts[i+1]*c;
    const [x,y]=w2s(wx,wy);
    if(x<-20||y<-20||x>W+20||y>H+20)continue;
    ctx.fillRect(x-1,y-1,2.2,2.2);}
}
function line(a,c,w){if(a.length<4)return;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();
  let p=w2s(a[0],a[1]);ctx.moveTo(p[0],p[1]);
  for(let i=2;i+1<a.length;i+=2){p=w2s(a[i],a[i+1]);ctx.lineTo(p[0],p[1]);}ctx.stroke();}
/* 网格: 放得够大才画(否则糊成一片), 5m/1m 两档 */
function drawGrid(){
  if(view.scale<8)return;
  const step=gridStep();
  const cs=[s2w(0,0),s2w(W,0),s2w(0,H),s2w(W,H)];
  const xs=cs.map(p=>p[0]), ys=cs.map(p=>p[1]);
  const minx=Math.floor(Math.min(...xs)/step)*step, maxx=Math.max(...xs);
  const miny=Math.floor(Math.min(...ys)/step)*step, maxy=Math.max(...ys);
  if((maxx-minx)/step>400||(maxy-miny)/step>400)return;
  ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--line');
  ctx.lineWidth=1;ctx.globalAlpha=.6;ctx.beginPath();
  for(let x=minx;x<=maxx;x+=step){const a=w2s(x,miny),b=w2s(x,maxy);
    ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);}
  for(let y=miny;y<=maxy;y+=step){const a=w2s(minx,y),b=w2s(maxx,y);
    ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);}
  ctx.stroke();ctx.globalAlpha=1;
}
function drawRobot(){
  const [x,y]=w2s(robot.x,robot.y);
  ctx.save();ctx.translate(x,y);ctx.rotate(-robot.yaw-view.rot);
  ctx.fillStyle='#2f7ef7';ctx.beginPath();
  ctx.moveTo(15,0);ctx.lineTo(-9,9);ctx.lineTo(-5,0);ctx.lineTo(-9,-9);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.6;ctx.stroke();
  ctx.restore();
  // 定位光晕: 让小车在密集的激光点里也一眼可见
  ctx.strokeStyle='#2f7ef755';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,17,0,7);ctx.stroke();
}
/* 画中画里的小地图(相机为主画面时) */
function drawMini(){
  const c=$('pipMini');if(!c)return;
  const r=c.parentElement.getBoundingClientRect();
  c.width=r.width*DPR;c.height=r.height*DPR;
  const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#0b1220';g.fillRect(0,0,r.width,r.height);
  if(!mapMeta||!mapImg)return;
  const s=Math.min(r.width/(mapMeta.w*mapMeta.res),r.height/(mapMeta.h*mapMeta.res))*0.92;
  const ox=r.width/2-mapMeta.w*mapMeta.res*s/2, oy=r.height/2-mapMeta.h*mapMeta.res*s/2;
  g.imageSmoothingEnabled=false;
  g.drawImage(mapImg,ox,oy,mapMeta.w*mapMeta.res*s,mapMeta.h*mapMeta.res*s);
  if(robot.ok){
    const rx=ox+(robot.x-mapMeta.ox)*s, ry=oy+(mapMeta.h*mapMeta.res-(robot.y-mapMeta.oy))*s;
    // 缩略图里也画成箭头, 不然看不出车头朝哪
    g.save();g.translate(rx,ry);g.rotate(-robot.yaw);
    g.fillStyle='#2f7ef7';g.beginPath();
    g.moveTo(9,0);g.lineTo(-6,5.5);g.lineTo(-3.5,0);g.lineTo(-6,-5.5);g.closePath();g.fill();
    g.strokeStyle='#fff';g.lineWidth=1.2;g.stroke();
    g.restore();
  }
}

/* ============ 3D 点云(建图模式, 原生WebGL) ============

const cv3=$('cv3d');let gl=null,prog=null,vbo=null,cloudDirty=false,gridVbo=null,gridN=0,carVbo=null;

   怎么歪。本车雷达是下倾装的, 所以原始点云里地面是斜的、和网格对不上。
   校平 = 把地面法向转回 +Z, 再把原点抬到地面(加 lidar_z), 地面就落在 z=0,
   正好和网格重合; "只看地面上方 0~2m"这个高度带也才有意义。

   【地面法向从哪来】优先用**后端实时拟合**出来的(state.ground, 见 app.py 的
   GroundFitter), 拟合不出来才退回下面的标称值。
   为什么不能只靠标称值: 2026-08-07 实测 launch 里写的 lidar_pitch=0.191rad(10.9°)
   与实际差了一倍(IMU重力法和点云拟合一致给出约 0.10rad), 倾角错一倍, 15m 外
   地面和网格就差一米多。死数会过期, 拟合不会。 */
const C3={level:localStorage.getItem('v3level')!=='0',
          cull:localStorage.getItem('v3cull')!=='0',

          pan:localStorage.getItem('v3pan')==='1',  // 单指手势: false=旋转 true=平移
          pitch:0.191, roll:0.006, z:0.28, // 标称安装角(与两个 launch 的默认值对应)
          minH:-0.12, maxH:2.0,            // 显示高度带(相对地面)
          gnd:null};                       // 后端实测: {nx,ny,nz,z,fit,...}
/* 标称安装角推出的地面法向(camera_init 系)。
   base_footprint->livox 的旋转是 Ry(pitch)·Rx(roll)(pitch>0=下倾), 所以地面法向
   (0,0,1) 落到雷达系是 Rx(-roll)·Ry(-pitch)·ẑ = (-sinθ, sinφcosθ, cosφcosθ)。
   **x 分量是负的**。2026-08-07 用 IMU 重力法实测 (-0.0998,+0.0168,+0.9949) 证实,
   与 pcd2pgm.cpp 的 up 向量约定一致。
   ⚠️ 这里以前写成了 +sinθ, 于是"校平"不是消掉倾角而是把倾角**加倍**了 —— 症状
   就是网格怎么调都贴不上地面。改这段务必先重推一遍符号。 */
function groundNormal(){
  const g=C3.gnd;
  if(g&&g.fit){
    const l=Math.hypot(g.nx,g.ny,g.nz)||1;
    return [g.nx/l,g.ny/l,g.nz/l];
  }
  const sp=Math.sin(C3.pitch),cp=Math.cos(C3.pitch);

/* 把地面法向 u 转到 +Z 的**最小旋转**(Rodrigues), 行主序(m[0..2]=第一行)。
   用"两向量间最小旋转"而不是按 pitch/roll 拼 Ry·Rx: 前者不引入任何绕 Z 的分量,
   也就是校平不会把地图整个转一个偏航 —— 和 pcd2pgm 的 FromTwoVectors 同一做法。 */
function levelMat(){
  const u=groundNormal();
  const c=u[2];                                  // u·ẑ
  if(c>0.999999)return [1,0,0, 0,1,0, 0,0,1];
  if(c<-0.999999)return [1,0,0, 0,-1,0, 0,0,-1]; // 反向: 绕 X 转 180°
  const v=[u[1],-u[0],0];                        // v = u × ẑ
  const k=1/(1+c);
  // R = I + [v]x + [v]x²·k
  const vx=v[0],vy=v[1];
  return [1-vy*vy*k,  vx*vy*k,   vy,

/* 送进着色器必须转成**列主序** —— GLSL 的 mat3 按列填充, 直接把行主序数组丢进去
   等于用了转置矩阵, 也就是反着转。2026-08-07 踩到: 点云"修正后反而朝另一边斜",
   而 CPU 侧剔除天花板用的是行主序解释, 两边各转各的, 剔除也就跟着不准。 */
function levelMatGL(m){

function initGL(){

  // ① 上面 const cv3 指向一个脱离文档的节点, clientHeight 变 0, 平移手势的
  //    "米/像素"被 ||1 兜成 19.66, 拖一下就飞出去几公里;
  // ② 下次 draw3d 再进来 $('cv3d') 已经是 null, 直接抛异常。
  // 改成盖一层提示, canvas 本身留着。
  if(!gl){
    if(!$('nogl')){
      const d=document.createElement('div');d.id='nogl';
      d.style.cssText='position:absolute;inset:0;display:grid;place-items:center;'+

  const vs=`attribute vec3 p;uniform mat4 mvp;uniform mat3 lev;uniform float zoff;

  const fs=`precision mediump float;varying float h;uniform float mode;uniform float dim;

      if(mode<-0.5){gl_FragColor=vec4(0.18,0.49,0.97,1.0);return;}   // 小车

/* 相机基, 单独抽出来是因为**平移手势要用同一组基向量** —— 手势和绘制各算各的

const FOVY_HALF=0.5;                 // 竖直半视场(弧度), 与 mat() 里的 f 对应
function camBasis(){
  const cp=Math.cos(cam3d.pitch),sp=Math.sin(cam3d.pitch);
  const cy=Math.cos(cam3d.yaw),sy=Math.sin(cam3d.yaw);
  const Z=[cp*cy,cp*sy,sp];                       // 目标->相机(相机的"后"方向)
  const X=[-sy,cy,0];                             // 相机右; cp>0 时恒为单位向量
  const Y=[Z[1]*X[2]-Z[2]*X[1],Z[2]*X[0]-Z[0]*X[2],Z[0]*X[1]-Z[1]*X[0]];  // 上
  return {X,Y,Z};

function mat(){ // 视图投影: 绕目标点(tx,ty,tz)的轨道相机

  const P=[f/a,0,0,0, 0,f,0,0, 0,0,(fa+n)/(n-fa),-1, 0,0,2*fa*n/(n-fa),0];
  const {X,Y,Z}=camBasis();
  const ex=cam3d.tx+cam3d.dist*Z[0], ey=cam3d.ty+cam3d.dist*Z[1],
        ez=cam3d.tz+cam3d.dist*Z[2];
  const V=[X[0],Y[0],Z[0],0, X[1],Y[1],Z[1],0, X[2],Y[2],Z[2],0,
    -(X[0]*ex+X[1]*ey+X[2]*ez), -(Y[0]*ex+Y[1]*ey+Y[2]*ez), -(Z[0]*ex+Z[1]*ey+Z[2]*ez),1];
  const M=new Float32Array(16);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;
    for(let k=0;k<4;k++)s+=V[i*4+k]*P[k*4+j];M[i*4+j]=s;}
  return M;
}
/* 高度带筛选: 只保留校平后离地高度在 [minH, maxH] 的点(实景模式就是"地面~2m")。
   在 CPU 侧筛而不是在着色器里 discard —— 点数直接少一半, 上传和绘制都省。
   ⚠️ 这里用的高度必须和着色器里 h=（lev*p).z+zoff 完全一致, 否则"看到的"和
   "筛掉的"对不上。levelMat() 是行主序, 所以第三行是 m[6..8]。 */
let drawN=0, liveN=0, filt=null, liveVbo=null, liveBuf=null;
function bandFilter(src,n,dst){
  const m=levelMat(),z0=groundZ();let k=0;
  for(let i=0;i<n;i++){
    const x=src[i*3],y=src[i*3+1],z=src[i*3+2];
    const h=m[6]*x+m[7]*y+m[8]*z+z0;
    if(h<C3.minH||h>C3.maxH)continue;
    dst[k*3]=x;dst[k*3+1]=y;dst[k*3+2]=z;k++;

function uploadCloud(){
  if(!C3.cull||!C3.level){   // 没校平就没有"真实高度"可言, 筛了反而是斜着切一刀
    gl.bufferData(gl.ARRAY_BUFFER,cloud.pos.subarray(0,cloud.n*3),gl.DYNAMIC_DRAW);
    drawN=cloud.n;cloudDirty=false;return;
  }
  if(!filt||filt.length<cloud.n*3)filt=new Float32Array(cloud.n*3);
  const k=bandFilter(cloud.pos,cloud.n,filt);

  drawN=k;cloudDirty=false;
}
function uploadLive(){
  const need=live.n*3;
  if(!liveBuf||liveBuf.length<need)liveBuf=new Float32Array(Math.max(need,3*8192));
  let o=0;
  for(const f of live.frames){liveBuf.set(f,o);o+=f.length;}
  const n=o/3|0;
  let k=n;
  if(C3.cull&&C3.level)k=bandFilter(liveBuf,n,liveBuf);   // 原地筛, k<=n 不会覆盖未读的
  gl.bufferData(gl.ARRAY_BUFFER,liveBuf.subarray(0,k*3),gl.DYNAMIC_DRAW);

let d3Req=false;
function draw3d(){if(d3Req||UI.mode!=='map')return;d3Req=true;requestAnimationFrame(_d3);}
function _d3(){
  d3Req=false;

  gl.uniformMatrix3fv(lev,false,levelMatGL(I3));

    gl.uniform1f(md,0.0);gl.uniform1f(psz,C3.scene?1.5:2.0);
    gl.uniform1f(dim,C3.scene?0.42:1.0);

    gl.uniform1f(md,0.0);gl.uniform1f(psz,3.4);gl.uniform1f(dim,1.0);
    gl.uniformMatrix3fv(lev,false,levelMatGL(LM));
    gl.uniform1f(zof,ZOFF);

  // 小车: 建图时 robot_pose 回的是 FAST-LIO 里程计(frame='lio'), 与点云同一个系,
  // 所以直接拿来用。校平开着时它也要跟着转, 否则会飘在地面上方/下方。
  if(robot.ok){
    if(!carVbo)carVbo=gl.createBuffer();
    const c=Math.cos(robot.yaw),sn=Math.sin(robot.yaw),z=robot.z||0;
    const pts=[[0.34,0,0],[-0.16,0.20,0],[-0.16,-0.20,0],[0.34,0,0],[0,0,0.5]];
    const v=[];
    for(const [a,b,cz] of pts) v.push(robot.x+a*c-b*sn, robot.y+a*sn+b*c, z+cz);
    gl.bindBuffer(gl.ARRAY_BUFFER,carVbo);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(v),gl.DYNAMIC_DRAW);
    gl.uniformMatrix3fv(lev,false,levelMatGL(LM));
    gl.uniform1f(zof,ZOFF);
    gl.uniform1f(md,-1.0);gl.uniform1f(psz,9.0);
    gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0);
    gl.drawArrays(gl.LINE_LOOP,0,4);      // 车体箭头
    gl.drawArrays(gl.POINTS,0,5);         // 顶点加粗, 远看也能定位
  }
}
/* ============ 3D 交互 ============
   pad:   单指拖 = 旋转(工具栏"单指平移"开着时改成平移)
          双指拖 = 平移       双指捏合 = 缩放(两者可同时进行)
          双击   = 复位视角
   鼠标:  左键拖 = 旋转   右键/Shift+左键拖 = 平移   滚轮 = 缩放

   【上一版为什么拖不动/拖歪】平移写的是
       tx -= dx*cos(yaw+90°)*s;  ty -= (dx*sin(yaw+90°) - dy*cos(pitch))*s
   横向那半是对的, 纵向那半只改了 ty —— 也就是**上下拖动永远沿世界 Y 走, 不跟
   视角转**。视角一转, 手往上拖画面却斜着跑, 就是这个。
   现在改成沿相机自己的 X/Y 基向量平移, 并且步长按透视关系算成"目标平面上 1 像素
   对应多少米", 手指按住哪个点, 那个点就跟着手指走。 */
(function(){
  let mode=0,lx=0,ly=0,pd=0,pts=0,lastTap=0;
  // 目标平面(过 tx,ty,tz 且垂直视线)上 1 个 CSS 像素对应多少米。
  // 竖直方向可见范围 = 2·dist·tan(半视场), 除以画布 CSS 高度即得。
  function mPerPx(){
    // 高度取不到时退到画布后备存储的尺寸, 再不行给个 800 —— **不能兜成 1**,
    // 那样比例尺会放大几百倍, 轻轻一拖画面就飞没了
    const h=cv3.clientHeight||(cv3.height/DPR)||800;
    return 2*cam3d.dist*Math.tan(FOVY_HALF)/h;
  }
  function pan(dx,dy){
    const {X,Y}=camBasis(),s=mPerPx();
    // 手指向右(dx>0) => 内容跟着向右 => 目标点向左(-X); 手指向下(dy>0) => 目标点向上(+Y)
    cam3d.tx+=(-X[0]*dx+Y[0]*dy)*s;
    cam3d.ty+=(-X[1]*dx+Y[1]*dy)*s;
    cam3d.tz+=(-X[2]*dx+Y[2]*dy)*s;
  }
  function orbit(dx,dy){
    cam3d.yaw-=dx*0.006;
    // 夹在 ±83°: 再抬就正对天顶, 相机右向量退化(camBasis 的 X 由 yaw 单独定),
    // 视角会绕着自己打转
    cam3d.pitch=Math.max(-1.45,Math.min(1.45,cam3d.pitch+dy*0.006));
  }
  function zoomAt(f,px,py){
    // 以屏幕上 (px,py) 为锚点缩放: 先按缩放前后的比例把目标点朝锚点挪, 再改距离。
    // 不这么做的话捏合永远围着画面正中缩, 想放大角落里的东西就得缩一下再拖一下。
    const r=cv3.getBoundingClientRect();
    const ox=px-r.left-r.width/2, oy=py-r.top-r.height/2;
    const d0=cam3d.dist;
    cam3d.dist=Math.max(1.0,Math.min(150,cam3d.dist*f));
    const {X,Y}=camBasis(), s=(d0-cam3d.dist)*mPerPx()/cam3d.dist;
    cam3d.tx+=(X[0]*ox-Y[0]*oy)*s;
    cam3d.ty+=(X[1]*ox-Y[1]*oy)*s;
    cam3d.tz+=(X[2]*ox-Y[2]*oy)*s;
  }
  function resetView(){
    cam3d.yaw=-0.9;cam3d.pitch=0.55;cam3d.dist=18;
    cam3d.tx=cam3d.ty=cam3d.tz=0;draw3d();
  }
  cv3.resetView=resetView;

  // ---- 鼠标 ----
  cv3.addEventListener('mousedown',e=>{
    mode=(e.button===2||e.shiftKey)?2:(C3.pan?2:1);lx=e.clientX;ly=e.clientY;});
  cv3.addEventListener('contextmenu',e=>e.preventDefault());
  addEventListener('mousemove',e=>{if(!mode)return;
    const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
    (mode===1?orbit:pan)(dx,dy);draw3d();});
  addEventListener('mouseup',()=>mode=0);
  cv3.addEventListener('wheel',e=>{e.preventDefault();
    zoomAt(1+Math.sign(e.deltaY)*0.12,e.clientX,e.clientY);draw3d();},{passive:false});
  cv3.addEventListener('dblclick',e=>{e.preventDefault();resetView();});

  // ---- 触摸 ----
  // touchstart 必须 passive:false: pad 上内核会在第一个 touchmove 之前就决定
  // 这串手势归谁, 不在 start 里 preventDefault 的话 Safari/部分 Chrome 会把它
  // 判给页面滚动/双击缩放, 表现就是"手指拖了但画面没反应/只抖一下"。
  // (#cv3d 的 CSS 已有 touch-action:none, 但那对 iPadOS Safari 不完全生效。)
  const T=e=>[...e.touches];
  function baseline(e){
    const t=T(e);pts=t.length;
    if(pts===1){lx=t[0].clientX;ly=t[0].clientY;}
    else if(pts>=2){
      lx=(t[0].clientX+t[1].clientX)/2;ly=(t[0].clientY+t[1].clientY)/2;
      pd=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
    }
  }
  cv3.addEventListener('touchstart',e=>{
    if(e.cancelable)e.preventDefault();
    // 双击(两次单指轻触)复位视角 —— pad 上没有滚轮, 转晕了要有一键回正
    if(T(e).length===1){
      const now=Date.now();
      if(now-lastTap<300){lastTap=0;resetView();return;}
      lastTap=now;
    }
    baseline(e);},{passive:false});
  cv3.addEventListener('touchmove',e=>{
    if(e.cancelable)e.preventDefault();
    const t=T(e);
    // 【手指数变了就重新取基准, 不要把这次手势丢掉】上一版在 touchend 里
    // 一律 mode=0, 于是双指里松开一根, 剩下那根就完全失灵, 得整只手抬起来重来。
    if(t.length!==pts){baseline(e);return;}
    if(t.length===1){
      const dx=t[0].clientX-lx,dy=t[0].clientY-ly;
      lx=t[0].clientX;ly=t[0].clientY;
      (C3.pan?pan:orbit)(dx,dy);
    }else if(t.length>=2){
      const cx=(t[0].clientX+t[1].clientX)/2,cy=(t[0].clientY+t[1].clientY)/2;
      const d=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
      // 先按上一帧的 dist 平移, 再缩放 —— 反过来的话这一帧的平移会用错的比例尺
      pan(cx-lx,cy-ly);
      if(Math.abs(d-pd)>1)zoomAt(pd/d,cx,cy);
      lx=cx;ly=cy;pd=d;
    }
    draw3d();},{passive:false});
  const end=e=>{const t=T(e);if(t.length)baseline(e);else{pts=0;mode=0;}};
  cv3.addEventListener('touchend',end);
  cv3.addEventListener('touchcancel',end);
})();

/* ============ 视图工具条 / 图例 ============ */

function syncVTool(){

  const cu=box.querySelector('[data-flag=cull]');  if(cu)cu.classList.toggle('on',C3.cull);

  const g=box.querySelector('[data-flag=grid]');   if(g)g.classList.toggle('on',showGrid);

/* ============ 2D 交互(导航页) ============
   空手拖动 = 平移地图; 滚轮/捏合 = 缩放。
   面板打开时(单点导航/多点巡航/设初始位姿): **按下选点、拖出朝向、松开生效**
   —— 和 RViz 的 2D Nav Goal 一个手感。只点一下不拖也可以, 朝向取当前车头方向。 */
let clickMode='';let goal=null,wps=[];
/* 终态标记的"停留计时": 到达/失败后先留一会儿给人看, 到点自动收起 */
let goalHoldT=null;
const GOAL_HOLD_MS=10000;
function goalHoldCancel(){if(goalHoldT){clearTimeout(goalHoldT);goalHoldT=null;}}
function goalMarkDone(st){
  if(!goal)return;
  goal.done=st;goalHoldCancel();
  goalHoldT=setTimeout(()=>{goalHoldT=null;
    if(goal&&goal.done){goal=null;draw();renderPanel();}},GOAL_HOLD_MS);
}
function goalClear(){goalHoldCancel();goal=null;}
let pick=null;          // {x,y,yaw,drag} 正在拖朝向的临时目标
/* armed: 只有点了"设目标"/"加航点"/"设初始位姿"之后的**下一次**按下才放点。
   之前是"面板开着就一直放点", 结果按下地图想平移也会变成放点, 根本挪不动图。 */
let armed='';           // '' | 'goal' | 'wp' | 'init'
function pickActive(){return armed!=='';}
function setArmed(a){
  armed=a; clickMode=a==='init'?'init':'';
  cv.style.cursor=a?'crosshair':'';
  if(a)toast({goal:'在地图上按住拖出朝向 → 松手下发',
              wp:'在地图上按住拖出朝向 → 松手添加航点',
              init:'在地图上按住拖出车头朝向 → 松手'}[a]);
  renderPanel();
}
(function(){
  let panning=false,lx=0,ly=0,downAt=null;   // panning/g 由下面的双指手势共用
  const wpt=e=>{const r=cv.getBoundingClientRect();
    return s2w(e.clientX-r.left,e.clientY-r.top);};
  cv.addEventListener('pointerdown',e=>{
    cv.setPointerCapture(e.pointerId);
    downAt={x:e.clientX,y:e.clientY,t:Date.now()};lx=e.clientX;ly=e.clientY;
    if(pickActive()){const [x,y]=wpt(e);pick={x,y,yaw:robot.yaw||0,drag:false};draw();}
    else panning=true;
  });
  cv.addEventListener('pointermove',e=>{
    if(pick){
      const [x,y]=wpt(e);
      const dx=x-pick.x,dy=y-pick.y;
      if(Math.hypot(dx,dy)>0.12){pick.yaw=Math.atan2(dy,dx);pick.drag=true;}
      draw();return;
    }
    if(!panning)return;
    const rx=(e.clientX-lx)/view.scale, ry=-(e.clientY-ly)/view.scale;
    const c=Math.cos(view.rot), sn=Math.sin(view.rot);
    view.cx-=rx*c+ry*sn; view.cy-=-rx*sn+ry*c;   // s2w 的方向导数, 转了也跟手
    lx=e.clientX;ly=e.clientY;follow=false;syncVTool();draw();
  });
  cv.addEventListener('pointerup',e=>{
    panning=false;
    if(pick){commitPick();return;}
    downAt=null;
  });
  cv.addEventListener('pointercancel',()=>{panning=false;pick=null;draw();});
  cv.addEventListener('wheel',e=>{e.preventDefault();
    view.scale=Math.max(3,Math.min(200,view.scale*(1-Math.sign(e.deltaY)*0.12)));
    follow=false;syncVTool();draw();},{passive:false});

  /* 双指: 捏合缩放 + 扭转旋转 + 平移。两指一落下就接管, 并取消单指正在做的
     平移/选点(否则会一边选点一边缩放, 手感很乱)。 */
  let g=null;
  const two=e=>{
    const [a,b]=[e.touches[0],e.touches[1]];
    return {d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),
            a:Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX),
            x:(a.clientX+b.clientX)/2, y:(a.clientY+b.clientY)/2};
  };
  cv.addEventListener('touchstart',e=>{
    if(e.touches.length!==2)return;
    panning=false;pick=null;
    g=two(e);draw();
  },{passive:true});
  cv.addEventListener('touchmove',e=>{
    if(e.touches.length!==2||!g)return;
    e.preventDefault();
    const n=two(e);
    if(g.d>0)view.scale=Math.max(3,Math.min(200,view.scale*n.d/g.d));
    // 屏幕 y 轴朝下, atan2 的角度增减和肉眼看到的转向相反 -> 这里要取负,
    // 否则手指顺时针拧、地图逆时针转(2026-08-07 用户反馈"老是反着转")
    view.rot-=n.a-g.a;
    const rx=(n.x-g.x)/view.scale, ry=-(n.y-g.y)/view.scale;
    const c=Math.cos(view.rot), sn=Math.sin(view.rot);
    view.cx-=rx*c+ry*sn; view.cy-=-rx*sn+ry*c;
    g=n;follow=false;syncVTool();draw();
  },{passive:false});
  cv.addEventListener('touchend',e=>{if(e.touches.length<2)g=null;});
})();
function commitPick(){
  const p=pick,a=armed;pick=null;setArmed('');
  if(!p)return;
  if(a==='init'){send({t:'initialpose',x:p.x,y:p.y,yaw:p.yaw});draw();return;}
  if(a==='wp'){wps.push({x:p.x,y:p.y,yaw:p.yaw});renderPanel();draw();return;}
  if(a==='goal'){
    // 先无条件把标记放上去 —— 导航没起时也让用户看见自己点在哪, 否则面板上
    // "目标点"永远显示"未设置", 看起来像点了没反应(2026-08-07 用户反馈)
    // done 必须一起重置 —— 不然新目标会继承上一次的"已到达"颜色和文字
    goalHoldCancel();goal={x:p.x,y:p.y,yaw:p.yaw,done:null};
    nav.dist=null;
    renderPanel();draw();
    if(!(S.running&&S.mode==='navigation')){
      toast('已标记, 但导航还没启动, 目标点没有下发',true);return;}
    // 秒表从"下发那一刻"起算, 不等后端的 running 状态 —— 后端的状态名/时机
    // 不一定和这里一致, 之前"已用时"一直显示 -- 就是卡在这
    navT0=Date.now();
    send({t:'goal',x:p.x,y:p.y,yaw:p.yaw});
    speak('goal_sent');renderPanel();draw();
  }
}
/* 带方向的目标标记 */
function markDir(x,y,yaw,c,n){
  const [sx,sy]=w2s(x,y);
  ctx.save();ctx.translate(sx,sy);ctx.rotate(-yaw-view.rot);
  ctx.strokeStyle=c;ctx.lineWidth=3;ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(26,0);ctx.stroke();
  ctx.fillStyle=c;ctx.beginPath();
  ctx.moveTo(32,0);ctx.lineTo(22,6);ctx.lineTo(22,-6);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(sx,sy,8,0,7);ctx.fill();
  if(n){ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
    ctx.textBaseline='middle';ctx.fillText(n,sx,sy);}
}
