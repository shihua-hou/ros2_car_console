          <button class="danger" onclick="cancelGoal()" ${running?'':'disabled'}>停止</button></div>
        <div class="row"><button onclick="saveRoute()" ${wps.length?'':'disabled'}>保存路线</button></div>
      </div>`;
    const L=$('wpList');
    wps.forEach((p,i)=>{
      const d=document.createElement('div');
      d.className='wp'+(nav.index===i+1?' cur':'');
      // 航点也把朝向显示出来 —— 巡航到点后车会转到这个角度, 看不到就没法核对
      d.innerHTML=`<span class="n">${i+1}</span>
        <span class="co">${p.x.toFixed(2)}, ${p.y.toFixed(2)} · ${((p.yaw||0)*57.3).toFixed(0)}°</span>
        <span class="d"><svg class="ic"><use href="#i-trash"/></svg></span>`;
      d.querySelector('.d').onclick=()=>{wps.splice(i,1);renderPanel();draw();};
      L.append(d);});
    updatePanelLive();
  }
}
/* 只刷会变的那几个数字, 不重建整个面板 —— 位姿是 5Hz 来的, 每次都 innerHTML
   会让航点列表闪烁、正在点的按钮丢焦点。 */
function updatePanelLive(){
  const set=(id,v)=>{const e=$(id);if(e)e.textContent=v;};
  set('pnDist', nav.dist!=null?nav.dist.toFixed(2)+' m':'--');
  set('pnTime', elapsedTxt());
  set('pnCur',    robot.ok?robot.x.toFixed(2)+', '+robot.y.toFixed(2):'--');
  set('pnCurYaw', robot.ok?(robot.yaw*57.3).toFixed(0)+'°':'--');
  set('pnGoal',    goal?goal.x.toFixed(2)+', '+goal.y.toFixed(2):'未设置');
  set('pnGoalYaw', goal?((goal.yaw||0)*57.3).toFixed(0)+'°':'--');
  const st=$('pnState');
  if(st&&UI.panel==='goal'){
    // 状态行右侧那颗胶囊: 有目标就显示它的坐标, 到达了加个"已到达"
    const done={succeeded:'已到达',failed:'失败',rejected:'被拒'}[goal&&goal.done]||'';
    st.innerHTML=`<b>${esc(navText())}</b>`+
      (goal?`<span class="pill">${goal.x.toFixed(2)}, ${goal.y.toFixed(2)}`+
            `${done?' · '+done:''}</span>`:'');
  }
}
function elapsedTxt(){
  const s=nav.elapsed!=null?nav.elapsed:(navT0?(Date.now()-navT0)/1000:null);
  if(s==null)return '--';
  const m=Math.floor(s/60);
  return m?`${m}分${String(Math.floor(s%60)).padStart(2,'0')}秒`:`${Math.round(s)} 秒`;
}
function navText(){
  const m={idle:'空闲',running:'导航中',succeeded:'已到达',failed:'失败',
           canceled:'已取消',rejected:'被拒绝'};
  return m[nav.state]||nav.state||'空闲';
}
/* 播报只在**状态跃迁**上触发。后端每收到一条反馈就重发一遍完整 nav_info,
   新客户端连上时也会补发一条 —— 按当前状态播的话会重复念。 */
function onNavUpdate(was,wasWp){
  renderPanel();
  if(nav.state!==was){
    if(nav.state==='succeeded')speak(nav.kind==='follow'?'cruise_done':'arrived');
    else if(nav.state==='failed')speak('nav_failed');
    else if(nav.state==='canceled')speak('nav_canceled');
    else if(nav.state==='rejected')speak('nav_rejected');
  }
  // 多点巡航途中每到一个航点报一次进度: wp_index 从 k 变 k+1 就是第 k+1 个到了
  if(nav.kind==='follow'&&nav.state==='running'&&
     typeof nav.wp_index==='number'&&nav.wp_index!==wasWp&&nav.wp_index>0)
    speak('wp_'+nav.wp_index);
}
/* 起点: 导航启动后收到的第一个位姿。长按按钮可把当前位置设成新起点。 */
let homePose=JSON.parse(localStorage.getItem('v2home')||'null');
function setHome(p){homePose=p;localStorage.setItem('v2home',JSON.stringify(p));
  toast(`起点已设为 ${p.x.toFixed(2)}, ${p.y.toFixed(2)}`);draw();}
function goHome(){
  if(!(S.running&&S.mode==='navigation')){toast('回到起点需要先启动导航',true);return;}
  if(!homePose){toast('还没有起点 —— 长按此键把当前位置设为起点',true);return;}
  goalHoldCancel();goal={...homePose,done:null};navT0=Date.now();nav.dist=null;
  send({t:'goal',x:homePose.x,y:homePose.y,yaw:homePose.yaw||0});
  speak('go_home');draw();renderPanel();
}
function cancelGoal(){send({t:'cancel_goal'});goalClear();navT0=null;nav.dist=null;
  draw();renderPanel();}
function startCruise(loop){
  if(!wps.length){toast('先在地图上点几个巡航点',true);return;}
  // 巡航一开, 上一次单点导航的目标点就作废了 —— 留着它只会和航点标记混在一起
  goalClear();nav.dist=null;

/* 把后端读回来的真实参数填进滑条。读不到(导航没起)就保留默认值并说明。 */
function applyNavParams(m){
  const p=m.params||{};
  if(!$('rvx'))return;                    // 弹窗已经关了
  const put=(id,key,tf)=>{
    if(p[key]==null)return;
    const el=$(id), val=tf?tf(p[key]):p[key];
    // 车上的值可能超出滑条量程(比如配置文件里 wz_max=1.2 而滑条最小 0.3),
    // 超了就把量程撑开, 不然滑条会把它悄悄夹到边界, 一点"应用"反而改了参数
    if(val<+el.min)el.min=(Math.floor(val*10)/10).toFixed(2);
    if(val>+el.max)el.max=(Math.ceil(val*10)/10).toFixed(2);
    el.value=val;
  };
  put('rvx','FollowPath.vx_max');
  put('rvn','FollowPath.vx_min',v=>Math.abs(v));
  put('rwz','FollowPath.wz_max');
  put('rir','FollowPath.ObstaclesCritic.inflation_radius');
  put('rcs','FollowPath.ObstaclesCritic.cost_scaling_factor');
  syncNavLabels();
  const n=$('npNote');
  if(n)n.innerHTML=m.live
    ? '滑条已同步为车上的当前值。仅对本次导航生效, 重启导航恢复配置文件默认值。'
      +'膨胀半径三处(MPPI/局部图/全局图)同步修改 —— Humble 版 MPPI 要求完全一致。'
    : '<span style="color:var(--err)">读不到当前值(导航没在运行), '
      +'下面显示的是配置文件默认值。</span>';
}

/* ============ 地图编辑器 ============
   目的: 建图录进去的东西搬走了、或者地面被误判成障碍, 直接在图上改掉,
   不用重新建图(重建一次要走一圈, 还未必更好)。

   【三个值不能含糊】PGM 只有三种状态, 后端 edit_png_to_pgm 按灰度分类回写:
   >200 自由(254) / <80 占据(0) / 其余未知(205)。所以画的时候必须**正好**落在
   255/0/128 这三个值上 —— 这就是为什么下面全部用整数 fillRect / 直接写
   ImageData, 一处都不用 canvas 的 stroke: 描边是抗锯齿的, 边缘会出中间灰度,
   存回去就变成一圈"未知", 图上看着像描了一道毛边。

   【为什么自己维护 cells 而不是每次读画布】ImageData 是唯一的真相来源太慢
   (每次落笔都要 getImageData)。这里 cells(每格1字节) + img(RGBA) 双份同步,
   落笔只改脏矩形, putImageData 也只提交脏矩形。 */
const MATC=[128,255,0];          // 0=未知(灰) 1=自由(白) 2=障碍(黑)
const MATN=['未知','可通行','障碍'];
const ED={open:false,name:'',pending:'',w:0,h:0,res:0.05,ox:0,oy:0,
  cells:null,img:null,off:null,octx:null,ctx:null,vw:1,vh:1,
  view:{tx:0,ty:0,s:1},
  tool:'brush',mat:2,size:5,pan:false,grid:true,
  undo:[],redo:[],dirty:false,
  snap:null,sbox:null,fbox:{x0:1e9,y0:1e9,x1:-1,y1:-1},
  drag:null,g:null,pen:false,hover:null};

function edRequest(name){
  ED.pending=name;
  toast('正在载入 '+name+' …');
  send({t:'load_map_edit',name});
}
/* 收到 B_MAP_EDIT(t=7) 的精确三色图后进这里 */
function edOpen(meta,img){
  ED.w=meta.w;ED.h=meta.h;ED.res=meta.res||0.05;
  ED.ox=meta.ox||0;ED.oy=meta.oy||0;
  ED.name=meta.name||ED.pending||'';
  const off=document.createElement('canvas');
  off.width=ED.w;off.height=ED.h;
  const octx=off.getContext('2d',{willReadFrequently:true});
  octx.imageSmoothingEnabled=false;octx.drawImage(img,0,0);
  ED.off=off;ED.octx=octx;
  ED.img=octx.getImageData(0,0,ED.w,ED.h);
  const d=ED.img.data,n=ED.w*ED.h;
  ED.cells=new Uint8Array(n);
  for(let i=0;i<n;i++){
    const g=d[i<<2],v=g>200?1:(g<80?2:0);
    ED.cells[i]=v;
    const c=MATC[v],o=i<<2;
    d[o]=d[o+1]=d[o+2]=c;d[o+3]=255;      // 归一化: PNG 解码可能带出别的值
  }
  octx.putImageData(ED.img,0,0);
  ED.undo=[];ED.redo=[];ED.dirty=false;ED.snap=null;ED.sbox=null;ED.drag=null;ED.g=null;
  ED.fbox={x0:1e9,y0:1e9,x1:-1,y1:-1};
  ED.open=true;
  go('edit');
  edRenderTools();edResize();edFit();
  if(localStorage.getItem('edges1')!=='1')$('edHint').classList.add('show');
}
function edReload(){
  if(ED.dirty&&!confirm('放弃当前所有修改, 重新载入原图?'))return;
  edRequest(ED.name);
}

/* ---- 视图 ---- */
function edResize(){
  const cv=$('edCv');if(!cv)return;
  const r=cv.getBoundingClientRect();
  /* 分母绝不能兜成 1: 3D 视图那次就是 clientHeight||1 把 1 像素当成 19.66m,
     轻轻一拖飞出去几公里。这里按 rect -> clientWidth -> 窗口 逐级兜底。 */
  ED.vw=Math.max(2,Math.round(r.width||cv.clientWidth||innerWidth));
  ED.vh=Math.max(2,Math.round(r.height||cv.clientHeight||(innerHeight-54)));
  cv.width=ED.vw*DPR;cv.height=ED.vh*DPR;
  ED.ctx=cv.getContext('2d');
  edDraw();
}
function edMinScale(){return Math.min(ED.vw/ED.w,ED.vh/ED.h)*0.4;}
function edFit(){
  if(!ED.w)return;
  const s=Math.min(ED.vw/ED.w,ED.vh/ED.h)*0.92;
  ED.view={s,tx:(ED.vw-ED.w*s)/2,ty:(ED.vh-ED.h*s)/2};
  edDraw();edSyncTools();
}
/* 以 (cx,cy) 为锚点缩放: 手指/光标按住的那一格不动。只算数, 画由调用方负责。 */
function edZoom(f,cx,cy){
  const s=Math.max(edMinScale(),Math.min(80,ED.view.s*f)),k=s/ED.view.s;
  ED.view.tx=cx-(cx-ED.view.tx)*k;
  ED.view.ty=cy-(cy-ED.view.ty)*k;
  ED.view.s=s;
}
function edZoomUI(f,cx,cy){edZoom(f,cx,cy);edDraw();edSyncTools();}

function edDraw(){
  const c=ED.ctx;if(!c||!ED.off)return;
  const {tx,ty,s}=ED.view,W=ED.vw,H=ED.vh;
  c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,W,H);
  c.imageSmoothingEnabled=false;          // 放大时要看得见"格", 不要糊成一片
  c.drawImage(ED.off,tx,ty,ED.w*s,ED.h*s);
  c.strokeStyle='#7f8ca066';c.lineWidth=1;
  c.strokeRect(tx-.5,ty-.5,ED.w*s+1,ED.h*s+1);
  const L=Math.max(tx,0),R=Math.min(tx+ED.w*s,W),T=Math.max(ty,0),B=Math.min(ty+ED.h*s,H);
  if(ED.grid&&s>=9){                      // 一格不到 9px 就画成一团黑, 不如不画
    const x0=Math.max(0,Math.floor(-tx/s)),x1=Math.min(ED.w,Math.ceil((W-tx)/s));
    const y0=Math.max(0,Math.floor(-ty/s)),y1=Math.min(ED.h,Math.ceil((H-ty)/s));
    c.beginPath();c.strokeStyle='#7f8ca047';
    for(let x=x0;x<=x1;x++){const p=Math.round(tx+x*s)+.5;c.moveTo(p,T);c.lineTo(p,B);}
    for(let y=y0;y<=y1;y++){const p=Math.round(ty+y*s)+.5;c.moveTo(L,p);c.lineTo(R,p);}
    c.stroke();
  }
  const m=Math.max(1,Math.round(1/ED.res));   // 1 米 = 多少格
  if(ED.grid&&s*m>=22){                       // 米线: 描绘时判断真实尺寸全靠它
    const x0=Math.max(0,Math.floor(-tx/s/m)*m),y0=Math.max(0,Math.floor(-ty/s/m)*m);
    c.beginPath();c.strokeStyle='#7f8ca066';
    for(let x=x0;x<=ED.w;x+=m){const p=Math.round(tx+x*s)+.5;
      if(p>=-1&&p<=W+1){c.moveTo(p,T);c.lineTo(p,B);}}
    for(let y=y0;y<=ED.h;y+=m){const p=Math.round(ty+y*s)+.5;
      if(p>=-1&&p<=H+1){c.moveTo(L,p);c.lineTo(R,p);}}
    c.stroke();
  }
  const d=ED.drag;
  if(d&&!d.pan&&(ED.tool==='line'||ED.tool==='rect')){   // 未落笔的预览
    c.save();c.strokeStyle=ED.mat===2?'#ec4b4b':(ED.mat===1?'#17b978':'#f5a524');
    c.lineWidth=2;c.setLineDash([6,4]);
    if(ED.tool==='rect'){
      const a=Math.min(d.x0,d.x),b=Math.min(d.y0,d.y);
      c.strokeRect(tx+a*s,ty+b*s,(Math.abs(d.x-d.x0)+1)*s,(Math.abs(d.y-d.y0)+1)*s);
    }else{
      c.beginPath();c.moveTo(tx+(d.x0+.5)*s,ty+(d.y0+.5)*s);
      c.lineTo(tx+(d.x+.5)*s,ty+(d.y+.5)*s);c.stroke();
    }
    c.restore();
  }
  if(ED.hover&&!ED.pan&&ED.tool!=='fill'&&s>=3){         // 笔刷落点圈
    const [hx,hy]=ED.hover,r=ED.size*s/2;
    c.save();c.strokeStyle='#4d92ffcc';c.lineWidth=1.5;
    c.beginPath();c.arc(tx+(hx+.5)*s,ty+(hy+.5)*s,Math.max(3,r),0,7);c.stroke();c.restore();
  }
}

/* ---- 落笔(全部整数写入, 不经过任何抗锯齿路径) ---- */
function edMark(x,y){
  const f=ED.fbox;
  if(x<f.x0)f.x0=x;if(x>f.x1)f.x1=x;if(y<f.y0)f.y0=y;if(y>f.y1)f.y1=y;
  const b=ED.sbox;
  if(b){if(x<b.x0)b.x0=x;if(x>b.x1)b.x1=x;if(y<b.y0)b.y0=y;if(y>b.y1)b.y1=y;}
}
function edSet(x,y,v){
  if(x<0||y<0||x>=ED.w||y>=ED.h)return;
  const i=y*ED.w+x;if(ED.cells[i]===v)return;
  ED.cells[i]=v;
  const d=ED.img.data,o=i<<2,g=MATC[v];
  d[o]=d[o+1]=d[o+2]=g;d[o+3]=255;
  edMark(x,y);
}
function edFlush(){                       // 只把脏矩形提交到离屏画布
  const b=ED.fbox;if(b.x1<b.x0)return;
  ED.octx.putImageData(ED.img,0,0,b.x0,b.y0,b.x1-b.x0+1,b.y1-b.y0+1);
  ED.fbox={x0:1e9,y0:1e9,x1:-1,y1:-1};
}
function edStamp(cx,cy,v){
  const r=(ED.size-1)>>1;
  if(r<=0){edSet(cx,cy,v);return;}
  for(let dy=-r;dy<=r;dy++){
    const dx=Math.floor(Math.sqrt(r*r-dy*dy+0.25));
    for(let x=cx-dx;x<=cx+dx;x++)edSet(x,cy+dy,v);
  }
}
/* 两次触摸事件之间要补满 —— 手划快了 pointermove 是稀疏的, 不补就画成一串点 */
function edSeg(x0,y0,x1,y1,v){
  const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));
  if(!n){edStamp(x0,y0,v);return;}
  for(let i=0;i<=n;i++)
    edStamp(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),v);
}
function edRectFill(x0,y0,x1,y1,v){
  const a=Math.min(x0,x1),b=Math.max(x0,x1),p=Math.min(y0,y1),q=Math.max(y0,y1);
  for(let y=p;y<=q;y++)for(let x=a;x<=b;x++)edSet(x,y,v);
}
/* 油漆桶: 扫描线洪泛。整间屋子填成可通行, 或者把一块噪点区整片抹掉。 */
function edFill(sx,sy,v){
  if(sx<0||sy<0||sx>=ED.w||sy>=ED.h)return;
  const from=ED.cells[sy*ED.w+sx];
  if(from===v)return;
  const st=[sx,sy];
  while(st.length){
    const y=st.pop(),x=st.pop(),row=y*ED.w;
    if(ED.cells[row+x]!==from)continue;
    let a=x;while(a>0&&ED.cells[row+a-1]===from)a--;
    let b=x;while(b<ED.w-1&&ED.cells[row+b+1]===from)b++;
    for(let k=a;k<=b;k++){
      edSet(k,y,v);
      if(y>0&&ED.cells[row-ED.w+k]===from)st.push(k,y-1);
      if(y<ED.h-1&&ED.cells[row+ED.w+k]===from)st.push(k,y+1);
    }
  }
}

/* ---- 撤销栈: 每笔只存改动包围盒的前后两份, 不存整张图 ---- */
function edBegin(){ED.snap=ED.cells.slice();ED.sbox={x0:1e9,y0:1e9,x1:-1,y1:-1};}
function edCommit(){
  if(!ED.snap)return;
  const b=ED.sbox;ED.sbox=null;
  if(b.x1<b.x0){ED.snap=null;return;}          // 一格没改, 不入栈
  const x=b.x0,y=b.y0,w=b.x1-x+1,h=b.y1-y+1;
  const before=new Uint8Array(w*h),after=new Uint8Array(w*h);
  for(let j=0;j<h;j++){
    const s0=(y+j)*ED.w+x,d0=j*w;
    for(let i=0;i<w;i++){before[d0+i]=ED.snap[s0+i];after[d0+i]=ED.cells[s0+i];}
  }
  ED.undo.push({x,y,w,h,before,after});
  if(ED.undo.length>80)ED.undo.shift();
  ED.redo.length=0;ED.snap=null;ED.dirty=true;
  edSyncTools();
}
function edRevert(){                            // 双指落下 -> 刚才那一点是误触
  if(!ED.snap)return;
  const b=ED.sbox;
  if(b&&b.x1>=b.x0){
    for(let y=b.y0;y<=b.y1;y++)for(let x=b.x0;x<=b.x1;x++)edSet(x,y,ED.snap[y*ED.w+x]);
    edFlush();
  }
  ED.snap=null;ED.sbox=null;
}
function edPatch(p,key){
  const buf=p[key];
  for(let j=0;j<p.h;j++)for(let i=0;i<p.w;i++)edSet(p.x+i,p.y+j,buf[j*p.w+i]);
  edFlush();ED.dirty=true;edDraw();edSyncTools();
}
function edUndo(){
  const p=ED.undo.pop();
  if(!p){toast('没有可撤销的了',true);return;}
  ED.redo.push(p);edPatch(p,'before');
}
function edRedo(){
  const p=ED.redo.pop();
  if(!p){toast('没有可重做的了',true);return;}
  ED.undo.push(p);edPatch(p,'after');
}

/* ---- 保存 ---- */
/* 后端有没有这个能力。static 页是按 mtime 热重载的、app.py 不是, 所以完全可能
   出现"新前端 + 旧后端"。这时候不能在对话框里承诺备份 —— 旧后端是直接覆盖的。 */
function edCap(c){return Array.isArray(S.caps)&&S.caps.indexOf(c)>=0;}
function edSave(asNew){
  if(!ED.open||!ED.name){toast('没有打开的地图',true);return;}
  let target=ED.name;
  if(asNew){
    if(!edCap('map_edit_saveas')){
      toast('后端还是旧版, 不支持另存为 —— 请重启 wheeltec-webapp 服务',true);return;}
    const v=prompt('另存为新地图(中英文/数字/下划线/减号):',ED.name+'_edit');
    if(v===null)return;
    target=v.trim();
    if(!/^[\w\-一-鿿]{1,64}$/.test(target)){toast('地图名不合法',true);return;}
  }else if(!confirm(`覆盖保存到 "${ED.name}" ?\n`+(edCap('map_edit_backup')
      ? '旧图会自动备份到 map/_backup/。'
      : '⚠️ 后端是旧版, 【不会备份】, 覆盖后原图找不回来。\n'
        +'建议先重启 wheeltec-webapp 服务再保存。')))return;
  const b64=ED.off.toDataURL('image/png').split(',')[1];
  // 后端 websocket 的 max_size 是 1MB, 超了连接会被直接断开(比报错还难查)
  if(b64.length>900*1024){
    toast('图太大传不过去('+(b64.length/1024|0)+'KB), 请分块编辑或降低分辨率',true);return;}
  send({t:'save_map_edit',name:target,src:ED.name,png_b64:b64});
  ED.dirty=false;ED.name=target;edSyncTools();
}

/* 桌面上顺手支持 Ctrl+Z / Ctrl+Shift+Z(或 Ctrl+Y) —— 平板用右侧按钮 */
addEventListener('keydown',e=>{
  if(UI.route!=='edit'||!(e.ctrlKey||e.metaKey))return;
  const k=e.key.toLowerCase();
  if(k==='z'){e.preventDefault();e.shiftKey?edRedo():edUndo();}
  else if(k==='y'){e.preventDefault();edRedo();}
  else if(k==='s'){e.preventDefault();edSave(false);}
});
function edSyncTools(){
  const box=$('edTools');if(!box)return;
  const on=(f,v)=>{const b=box.querySelector(`[data-flag=${f}]`);if(b)b.classList.toggle('on',!!v);};
  on('brush',ED.tool==='brush');on('line',ED.tool==='line');
  on('rect',ED.tool==='rect');on('fill',ED.tool==='fill');
  on('pan',ED.pan);on('grid',ED.grid);
  const dim=(f,v)=>{const b=box.querySelector(`[data-flag=${f}]`);
    if(b)b.style.opacity=v?1:.35;};
  dim('undo',ED.undo.length);dim('redo',ED.redo.length);
  const ph=box.querySelector('[data-flag=pan]');
  if(ph){ph.innerHTML=`<svg class="ic"><use href="#${ED.pan?'i-hand':'i-brush'}"/></svg>`;
    bindTip(ph,ED.pan?'单指=平移(点一下改回画)':'单指=画(点一下改成平移)');}
  document.querySelectorAll('#edBar .mat').forEach(el=>
    el.classList.toggle('on',+el.dataset.m===ED.mat));
  $('edSize').value=ED.size;
  $('edSizeV').textContent=ED.size+'格·'+(ED.size*ED.res*100).toFixed(0)+'cm';
  $('edNameT').textContent=ED.name||'';
  $('edNameS').textContent=`${ED.w}×${ED.h} · ${ED.res}m/格`
    +(ED.dirty?' · 未保存':'')+` · ${MATN[ED.mat]}`;
  $('edName').classList.toggle('dirty',ED.dirty);
  edStatus();
}
function edStatus(){
  const z=$('edZoom');if(!z)return;
  z.textContent=ED.view.s.toFixed(1)+' px/格';
  const h=ED.hover;
  $('edPos').textContent=(h&&h[0]>=0&&h[0]<ED.w&&h[1]>=0&&h[1]<ED.h)
    ? `(${(ED.ox+h[0]*ED.res).toFixed(2)}, ${(ED.oy+(ED.h-1-h[1])*ED.res).toFixed(2)})m` : '';
}
$('edHintOk').onclick=()=>{localStorage.setItem('edges1','1');

/* ---- 手势 ----
   单指=画(或平移), 双指=平移+捏合缩放, 双击=适应窗口。不做旋转: 图一转,
   "这一格在哪"就得在脑子里换算, 描绘反而更难对准。
   pointer 事件管单指/鼠标/触控笔, touch 事件专管双指 —— 和导航页那套一致。 */
(function(){
  const cv=$('edCv');if(!cv)return;
  const pos=e=>{const r=cv.getBoundingClientRect();
    return [e.clientX-r.left,e.clientY-r.top];};
  const cell=(sx,sy)=>[Math.floor((sx-ED.view.tx)/ED.view.s),
                       Math.floor((sy-ED.view.ty)/ED.view.s)];
  cv.addEventListener('pointerdown',e=>{
    if(!ED.open||ED.g)return;                      // 双指手势进行中, 单指一律不理
    if(e.pointerType==='touch'&&ED.pen)return;     // 触控笔在用 -> 忽略手掌
    if(e.pointerType==='pen')ED.pen=true;
    try{cv.setPointerCapture(e.pointerId);}catch(_){}   // 指针已抬起时会抛, 不影响画
    const [sx,sy]=pos(e);
    // 触控笔永远是画; 手指/鼠标看"单指模式"; 鼠标中键/右键永远是平移
    if(e.pointerType!=='pen'&&(ED.pan||e.button===1||e.button===2)){
      ED.drag={pan:true,sx,sy};return;}
    const [cx,cy]=cell(sx,sy);
    ED.drag={pan:false,x0:cx,y0:cy,x:cx,y:cy};
    if(ED.tool==='brush'){edBegin();edStamp(cx,cy,ED.mat);edFlush();}
    else if(ED.tool==='fill'){
      edBegin();edFill(cx,cy,ED.mat);edFlush();edCommit();ED.drag=null;}
    edDraw();
  });
  cv.addEventListener('pointermove',e=>{
    if(!ED.open)return;
    const [sx,sy]=pos(e);
    ED.hover=cell(sx,sy);
    if(ED.g||!ED.drag){edStatus();if(!ED.g&&ED.view.s>=3)edDraw();return;}
    if(ED.drag.pan){
      ED.view.tx+=sx-ED.drag.sx;ED.view.ty+=sy-ED.drag.sy;
      ED.drag.sx=sx;ED.drag.sy=sy;edDraw();return;}
    const [cx,cy]=ED.hover;
    if(ED.tool==='brush'){edSeg(ED.drag.x,ED.drag.y,cx,cy,ED.mat);edFlush();}
    ED.drag.x=cx;ED.drag.y=cy;
    edDraw();edStatus();
  });
  const up=e=>{
    if(e&&e.pointerType==='pen')ED.pen=false;
    const d=ED.drag;if(!d)return;
    ED.drag=null;
    if(!d.pan){
      if(ED.tool==='line'){edBegin();edSeg(d.x0,d.y0,d.x,d.y,ED.mat);edFlush();edCommit();}
      else if(ED.tool==='rect'){edBegin();edRectFill(d.x0,d.y0,d.x,d.y,ED.mat);
        edFlush();edCommit();}
      else if(ED.tool==='brush')edCommit();
    }
    edDraw();
  };
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',()=>{
    if(ED.drag&&!ED.drag.pan){edRevert();}
    ED.drag=null;ED.pen=false;edDraw();});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('wheel',e=>{e.preventDefault();
    const [sx,sy]=pos(e);edZoomUI(e.deltaY<0?1.18:1/1.18,sx,sy);},{passive:false});
  cv.addEventListener('dblclick',e=>{e.preventDefault();edFit();});

  const two=e=>{const a=e.touches[0],b=e.touches[1],r=cv.getBoundingClientRect();
    return {d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),
            x:(a.clientX+b.clientX)/2-r.left,y:(a.clientY+b.clientY)/2-r.top};};
  /* passive:false 是必须的: pad 上内核会在第一个 touchmove 之前就决定这串手势
     归谁, 不在 touchstart 里 preventDefault 就被判给页面滚动了。 */
  cv.addEventListener('touchstart',e=>{
    if(e.touches.length<2)return;
    e.preventDefault();
    if(ED.drag&&!ED.drag.pan)edRevert();     // 第二根手指落下 = 刚画的那点是误触
    ED.drag=null;ED.g=two(e);edDraw();
  },{passive:false});
  cv.addEventListener('touchmove',e=>{
    if(e.touches.length!==2)return;
    e.preventDefault();
    // 手指数变了就重新取基准, 而不是把整串手势丢掉(双指松成单指再落回来还能接着用)
    if(!ED.g){ED.g=two(e);return;}
    const n=two(e);
    if(ED.g.d>0)edZoom(n.d/ED.g.d,n.x,n.y);   // 以两指中点为锚点
    ED.view.tx+=n.x-ED.g.x;ED.view.ty+=n.y-ED.g.y;
    ED.g=n;edDraw();edStatus();
  },{passive:false});
  const tend=e=>{
    if(e.touches.length===2){ED.g=two(e);return;}   // 三指松成两指 -> 重新取基准
    if(e.touches.length<2)ED.g=null;
  };
  cv.addEventListener('touchend',tend);
  cv.addEventListener('touchcancel',tend);
})();

/* 存图的两个前提, 缺哪个就把哪个说清楚 —— 之前按钮直接灰掉, 看不出为什么 */
function blockReason(){
  if(S.running||S.stopping||S.external)
    return `当前有任务在运行(${TITLES[S.mode==='navigation'?'nav':'map']||S.mode})。`
         + 'MID360 的存图是独立的一步, 后端不允许两个任务并存 —— 请先「关闭导航/建图」再来。';
  if(!S.pcd_count)
    return '没有可用的点云分段。建图要先跑起来、遥控走一圈, 再**停止建图**'
         + '(停止那一刻才落盘), 然后才能存图。';
  return '';
}

        <div class="sw"><div class="t">语音播报<small>任务启停、到达、失败、低电量等</small></div>

      </div></div>
    <div class="card"><h4><svg class="ic"><use href="#i-ap"/></svg>WiFi 热点</h4>
      <div class="in">

          <div class="tgl" id="tAp"></div></div>
        <p style="font-size:11px;color:var(--dim);margin:6px 0 0">
          热点做在独立的 USB 网卡上, 开关它不影响走 WiFi/有线的连接。

    <div class="card"><h4><svg class="ic"><use href="#i-nav"/></svg>遥控速度</h4>

    <div class="card"><h4><svg class="ic"><use href="#i-lib"/></svg>关于</h4>

  $('apInfo').textContent=w.up?`${w.ssid||''} ${w.ip||''} · ${w.clients||0}台已连`:'未开启';
  $('tAp').classList.toggle('on',!!w.up);
  $('tSound').onclick=()=>{UI.sound=!UI.sound;localStorage.setItem('v2sound',UI.sound?'1':'0');
    $('tSound').classList.toggle('on',UI.sound);if(UI.sound)speak('sound_on');};
  $('tAp').onclick=()=>{const on=!$('tAp').classList.contains('on');
    $('tAp').classList.toggle('on',on);send({t:'ap_power',on});
    toast(on?'正在开启热点(约需1~2分钟)':'正在关闭热点');};
  $('rsvx').value=UI.vx; $('rswz').value=UI.wz;
  const sy=()=>{$('lsvx').textContent=(+$('rsvx').value).toFixed(2)+' m/s';
                $('lswz').textContent=(+$('rswz').value).toFixed(1)+' rad/s';};
  $('rsvx').oninput=()=>{UI.vx=+$('rsvx').value;localStorage.setItem('v2vx',UI.vx);sy();};
  $('rswz').oninput=()=>{UI.wz=+$('rswz').value;localStorage.setItem('v2wz',UI.wz);sy();};
  sy();
}


/* ============ 任务启停 ============ */
function startTask(mode){
  if(busy()){toast('已有任务在运行, 先停止',true);return;}
  const args={t:'start',sensor:'mid360',mode};
  if(mode==='navigation'&&UI.selMap)args.map_name=UI.selMap;
  send(args);
}
function stopTask(){ send({t:'stop'}); }

/* ============ 摇杆 ============
   **必须按固定周期重发 cmd_vel**: 后端有 0.6s 断流看门狗(WiFi掉线时自动刹车),
   而手按住不动是不产生 pointermove 的 —— 只在 move 里发的话, 稳住摇杆两秒
   就会被判定成"信号中断, 已自动刹车"。老界面用的也是 100ms 定时器。 */
(function(){
  const j=$('joy'),k=$('joyKnob');
  let act=false,cx=0,cy=0,R=56,vec=[0,0],timer=null;
  const apply=(dx,dy)=>{
    const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d;}
    k.style.transform=`translate(${dx}px,${dy}px)`;
    vec=[dx/R,-dy/R];
  };
  const start=e=>{
    if(!S.running&&!S.external){
      toast('底盘没在运行, 遥控无效 —— 先启动导航或建图',true);return;}
    act=true;j.classList.add('act');
    const r=j.getBoundingClientRect();
    cx=r.left+r.width/2;cy=r.top+r.height/2;R=r.width/2-34;
    move(e);
    clearInterval(timer);
    timer=setInterval(()=>{
      if(!act)return;
      send({t:'cmd_vel',vx:vec[1]*UI.vx,wz:-vec[0]*UI.wz});
    },100);
  };
  const move=e=>{if(!act)return;const p=e.touches?e.touches[0]:e;
    apply(p.clientX-cx,p.clientY-cy);};
  const end=()=>{if(!act)return;act=false;j.classList.remove('act');
    clearInterval(timer);timer=null;vec=[0,0];
    k.style.transform='';send({t:'cmd_stop'});};
  j.addEventListener('touchstart',e=>{e.preventDefault();start(e);},{passive:false});
  j.addEventListener('touchmove',e=>{e.preventDefault();move(e);},{passive:false});
  j.addEventListener('touchend',end);j.addEventListener('touchcancel',end);
  j.addEventListener('mousedown',start);
  addEventListener('mousemove',move);addEventListener('mouseup',end);
  addEventListener('blur',end);         // 切走页面也要刹车
})();

/* ============ 相机 ============ */
let camUrl=null,camN=0,camT=Date.now();
function showCam(buf){
  const blob=new Blob([new Uint8Array(buf,1)],{type:'image/jpeg'});
  const url=URL.createObjectURL(blob);
  const set=el=>{if(el)el.src=url;};
  set($('pipImg'));if(UI.pipMain)set($('camFullImg'));
  if(camUrl)URL.revokeObjectURL(camUrl);camUrl=url;
  $('pipHint').style.display='none';
  if(++camN>=10){const now=Date.now();
    $('pipFps').textContent=(camN*1000/(now-camT)).toFixed(0)+' fps';camN=0;camT=now;}
}

/* ============ 语音播报 ============
   音频由 tools/gen_voice.py 用 edge-tts **离线预生成**在 static/voice/<key>.mp3,
   浏览器只播 <audio> —— 红米平板那类系统浏览器的 WebView 没有 TTS 引擎,
   speechSynthesis 是静默不出声的, 所以不能反过来"以 TTS 为主、音频为辅"。
   speechSynthesis 只作为音频拿不到时的兜底。

   **key 就是文件名**, 没有别名表。新增一条: 在下表加一行 + 在 gen_voice.py 的
   PHRASES 加同名一行, 重跑脚本 + colcon build。下表的文本要和音频念的一致 ——
   它既是给读代码的人看的, 也是兜底 TTS 真正会念的那句。 */
const SPEAK={
  // 任务起停: S.mode 的四种取值 × 起/停, 由 state 跃迁自动触发, 八条都得有,
  // 少一条那次跃迁就是哑的(以前 save_map/lidar_test 的停止就没有)
  start_navigation:'导航已启动', stop_navigation:'导航已关闭',
  start_mapping:'建图已启动',   stop_mapping:'建图已结束',
  start_save_map:'开始保存地图',
  start_lidar_test:'雷达测试已启动', stop_lidar_test:'雷达测试已结束',
  /* 存图**没有** stop_save_map: 转图进程退出不等于转图成功(pcd2pgm 失败时照样退出),
     报"地图已保存"就成了谎报。改用日志里 pcd2pgm 真的写完盘那句话触发 map_saved,
     见 pushLog。stop_save_map.mp3 已生成但留着不用。 */
  // 导航过程
  goal_sent:'目标已下发', go_home:'正在返回起点',
  arrived:'已到达目标',   nav_failed:'导航失败',
  nav_canceled:'导航已取消', nav_rejected:'目标被拒绝',
  cruise_start:'开始巡航', cruise_done:'巡航完成',
  // 状态提示
  save_map:'开始保存地图', map_saved:'地图已保存', estop:'急停',
  relocalized:'重新定位成功', reloc_lost:'定位丢失, 正在重新定位',
  low_battery:'电量偏低, 请及时充电', sound_on:'语音播报已开启',
  obstacle:'前方有障碍',      // 预留给超声波急停(ROS侧还没接, 见 CLAUDE.md 5.7 末尾)
};
/* 航点进度是动态的: wp_1..wp_30 已预生成, 超出用 wp_generic 兜底 */
function speakInfo(key){
  if(SPEAK[key])return {file:key,txt:SPEAK[key]};
  const m=/^wp_(\d+)$/.exec(key);
  if(m)return {file:+m[1]<=30?key:'wp_generic', txt:'到达第'+m[1]+'个航点'};
  return null;
}
/* 移动端要求音频的首次播放发生在用户手势里, 之后**同一个元素**才能被脚本播放。
   所以整页共用一个 <audio>, 并在首次点击时静音预热解锁 —— 每次 new Audio()
   是解锁不了的, 那正是老版界面踩过的坑。 */
const Voice={
  _el:null, _primed:false, _last:0,
  el(){ if(!this._el){this._el=new Audio();this._el.preload='auto';} return this._el; },
  prime(){
    if(this._primed)return; this._primed=true;
    const a=this.el();
    try{ a.src='/voice/voice_on.mp3'; a.volume=0;
         const p=a.play(); if(p)p.then(()=>{a.pause();a.currentTime=0;}).catch(()=>{});
    }catch(e){}
  },
};
['pointerdown','touchstart','click'].forEach(ev=>
  window.addEventListener(ev,()=>Voice.prime(),{once:true,capture:true}));
function speak(key){
  if(!UI.sound)return;
  if(Date.now()-wsOpenAt<1500)return;     // 刚连上补发的是历史状态, 不播报
  const info=speakInfo(key); if(!info)return;
  const now=Date.now(); if(now-Voice._last<900)return; Voice._last=now;
  const a=Voice.el();
  try{
    a.pause(); a.src='/voice/'+info.file+'.mp3';
    a.volume=1;               // 不额外衰减, 响度跟随系统音量(prime 时置过 0)
    a.currentTime=0;
    const p=a.play();
    if(p)p.catch(()=>{ if(window.speechSynthesis){
      const u=new SpeechSynthesisUtterance(info.txt);u.lang='zh-CN';
      speechSynthesis.speak(u);} });
  }catch(e){}
}
/* 电量偏低播报(每5分钟最多一次)。阈值按实际读数区分 12V / 24V 电池包 ——
   本车 S100_diff 是 24V 包(空载 22~23V), 写死 10.5 的话永远播不出来。 */
const BAT=v=>v>18?{err:21.0,warn:22.4,lo:20.0,hi:26.0}:{err:10.5,warn:11.2,lo:10.0,hi:13.0};
let lastBat=0;
setInterval(()=>{
  if(S.voltage!=null&&S.voltage<BAT(S.voltage).err&&Date.now()-lastBat>3e5){
    lastBat=Date.now();speak('low_battery');}
},10000);

/* ============ 杂项 ============ */
let logN=0;
/* 有几条状态只在节点日志里出现, 后端没有对应的 WS 消息 —— 从日志文本认。
   auto_relocalize 的原话见 wheeltec_fastlio/src/auto_relocalize.cpp:
     "重定位成功: x=.. y=.. yaw=.. score=.."          (成功一次刷一条)
     "..判定定位丢失(小车可能被移动), 触发全局重定位"  (看门狗触发)
   注意别顺手写成 /重定位/ —— 每30秒那条"定位健康度…触发重定位"也含这两个字。 */
let _lastReloc=0;
function logVoice(line){
  if(!UI.sound)return;
  if(/重定位成功/.test(line)){                       // 日志里会连刷好几条, 5秒内只念一次
    if(Date.now()-_lastReloc>5000){_lastReloc=Date.now();speak('relocalized');} return;
  }
  if(/判定定位丢失/.test(line))speak('reloc_lost');
  else if(/地图已保存/.test(line))speak('map_saved');
}
function pushLog(line){
  logVoice(line);
  const b=$('logBody');const d=document.createElement('div');
  if(/ERROR|错误|失败/.test(line))d.className='e';
  else if(/WARN|警告/.test(line))d.className='w';
  d.textContent=line;b.append(d);
  while(b.childElementCount>200)b.firstChild.remove();
  b.scrollTop=b.scrollHeight;
  $('logCnt').textContent='· '+(++logN);
}
let toastT=null;
function toast(msg,err){
  const t=$('toast');t.textContent=msg;t.className='show'+(err?' err':'');
  clearTimeout(toastT);toastT=setTimeout(()=>t.className='',2600);
}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtTime(ts){
  if(!ts)return '';
  const d=new Date(ts*1000),p=n=>String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
// 秒表要一直走(哪怕位姿断了), 所以留一个每秒的轻量刷新; 面板结构不重建
setInterval(()=>{if(UI.panel)updatePanelLive();},1000);
/* 收起画面时顺便告诉后端别推了 —— 640x480@30 的 JPEG 流白占带宽和 CPU */
$('pipFold').onclick=()=>{
  const p=$('pip'),fold=!p.classList.contains('fold');
  p.classList.toggle('fold',fold);
  $('pipFold').textContent=fold?'+':'—';
  send({t:'cam',on:!fold});
  if(fold&&UI.pipMain){UI.pipMain=false;}     // 收起时不该还占着主画面
  layout();
};
$('logMin').onclick=()=>{const b=$('logBox');b.classList.toggle('min');
  b.classList.remove('big');$('logMin').textContent=b.classList.contains('min')?'+':'—';};
$('logBig').onclick=()=>{const b=$('logBox');b.classList.remove('min');
  b.classList.toggle('big');$('logBig').textContent=b.classList.contains('big')?'⌄':'⌃';
  $('logBody').scrollTop=$('logBody').scrollHeight;};
/* 【整页拖动的兜底】只靠 CSS(position:fixed + overscroll-behavior + touch-action)
   在部分浏览器上堵不住 —— 内核仍会把未被消费的 touchmove 当成页面平移, 表现就是
   "全屏了还能整页拖动"(2026-08-07 用户反馈)。这里在捕获阶段统一拦截: 只有落在
   明确可滚动的容器里(标了 touch-action:pan-*)才放行, 其余一律 preventDefault。
   注意必须 passive:false, 否则 preventDefault 无效。 */
/* #home 也要在列: 手机上首页是上下堆的(遥测在上、四个入口在下), 整页 overflow:auto,
   不列进来的话下面的入口卡就滑不到了。宽屏上首页正好一屏、没有滚动余量,
   下面那个"按实际余量判断"的逻辑会照样把手势拦掉, 不会因此又能拖。 */
const SCROLLABLE='#logBody,#navPanel,#tools,#edTools,#legend,#hLeft,#home,.page,.dlg .body';
/* 【关键】"是滚动容器" != "此刻还有滚动余量"。地图页/设置页内容不满一屏时,
   scrollHeight==clientHeight, 浏览器就把这次手势收回去平移整个页面 —— 而我上一版
   只要 closest() 匹配到 .page 就放行, 正好把它漏过去了(用户连续反馈两次仍可拖动)。
   现在改成按**实际余量**判断: 没有余量就一律拦掉。 */
document.addEventListener('touchmove',e=>{
  const el=e.target&&e.target.closest?e.target.closest(SCROLLABLE):null;
  if(el){
    const canY=el.scrollHeight-el.clientHeight>1;
    const canX=el.scrollWidth-el.clientWidth>1;
    if(canY||canX)return;          // 真的还能滚, 放行
  }
  if(e.cancelable)e.preventDefault();
},{passive:false,capture:true});
/* 双击缩放/长按选中也一并禁掉, 它们同样会让画面"跳一下" */
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>{
  if(!e.target.closest('#camFull'))e.preventDefault();   // 相机主画面的双击复位要留
});
addEventListener('resize',resize);
go('home');resize();connect();renderAll();
</script>
